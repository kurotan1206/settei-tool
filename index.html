<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="総合判定">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="snv-version" content="ef1732f6d5">
</head>
<body>
<meta name="snv-mode" content="pwa">
<title>総合判定ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0F14; --panel:#121820; --panel-2:#182029; --panel-3:#1F2933; --ink:#E8EEF4; --ink-2:#A6B2BF; --ink-3:#6F7C8A;
  --line:#26313D; --line-2:#1C2530;
  --accent:#A392F5; --accent-ink:#0B0F14; --accent-soft:#251F45;
  --hot:#D94848; --warm:#C98500; --cool:#3987E5; --none:#3B4652;
  --hot-text:#F09088; --warm-text:#F0B93A; --cool-text:#8BB8F2;
  --hot-soft:#3A1F1E; --warm-soft:#33290F; --cool-soft:#172A44;
  --device:#0A0D11; --device-2:#11161C; --device-line:#232B35; --led:#FFB13B; --led-dim:#6E5225; --led-label:#8E99A6;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  --plus:#D94848; --minus:#3987E5; --good:#3DBE7A;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#E9EDF1; --panel:#FFFFFF; --panel-2:#F3F5F8; --panel-3:#E9EDF2; --ink:#121A24; --ink-2:#4F5C6B; --ink-3:#7C8794;
    --line:#D3DAE2; --line-2:#E5E9EE;
    --accent:#5A3FC0; --accent-ink:#FFFFFF; --accent-soft:#EEEAFB;
    --hot:#D93B2B; --warm:#DFA21B; --cool:#3A7BD5; --none:#B9C2CC;
    --hot-text:#B42A1C; --warm-text:#8A6200; --cool-text:#245FB0;
    --hot-soft:#FBE9E6; --warm-soft:#FCF3DC; --cool-soft:#E6EFFA;
    --shadow:0 1px 2px rgba(18,26,36,.06), 0 6px 18px rgba(18,26,36,.06);
    --plus:#D93B2B; --minus:#3A7BD5; --good:#1E8A4C;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E9EDF1; --panel:#FFFFFF; --panel-2:#F3F5F8; --panel-3:#E9EDF2; --ink:#121A24; --ink-2:#4F5C6B; --ink-3:#7C8794;
  --line:#D3DAE2; --line-2:#E5E9EE;
  --accent:#5A3FC0; --accent-ink:#FFFFFF; --accent-soft:#EEEAFB;
  --hot:#D93B2B; --warm:#DFA21B; --cool:#3A7BD5; --none:#B9C2CC;
  --hot-text:#B42A1C; --warm-text:#8A6200; --cool-text:#245FB0;
  --hot-soft:#FBE9E6; --warm-soft:#FCF3DC; --cool-soft:#E6EFFA;
  --shadow:0 1px 2px rgba(18,26,36,.06), 0 6px 18px rgba(18,26,36,.06);
  --plus:#D93B2B; --minus:#3A7BD5; --good:#1E8A4C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:14px;line-height:1.55;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding:0 10px calc(78px + env(safe-area-inset-bottom));min-height:100vh}
.disp{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;letter-spacing:.01em;text-wrap:balance}
.num{font-family:"IBM Plex Mono","BIZ UDPGothic",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.led{font-family:"DotGothic16",ui-monospace,"Courier New",monospace}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---- top status strip ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 6px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.top .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.top .brand .t{font-size:17px;white-space:nowrap}
.top .brand .s{font-size:10px;color:var(--ink-3);letter-spacing:.1em;white-space:nowrap}
.top .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:baseline;gap:4px;font-size:10.5px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;white-space:nowrap}
.stat b{color:var(--ink-2);font-weight:400}
@media (max-width:440px){.top .brand .s{display:none}}

/* ---- panels ---- */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:12px;margin:10px 0}
.card h2{font-size:11px;margin:0 0 10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::after{content:"";flex:1;height:1px;background:var(--line-2)}
.card h2 .n{color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none}
.sub{font-size:11.5px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap;letter-spacing:.04em}
.badge.hot{background:var(--hot-soft);color:var(--hot-text);border-color:transparent}
.badge.warm{background:var(--warm-soft);color:var(--warm-text);border-color:transparent}
.badge.cool{background:var(--cool-soft);color:var(--cool-text);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:9px 13px;font-weight:700;line-height:1.2;transition:transform .06s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;font-weight:400}
.btn.block{width:100%}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:12.5px;display:flex;gap:10px;align-items:center;margin:10px 0;border-left:3px solid var(--accent)}
.notice .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:12.5px;max-width:92vw;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

/* ---- home ---- */
.unitform{display:flex;gap:8px;align-items:stretch}
.unitform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:24px;letter-spacing:.08em;background:var(--device);color:var(--led)}
.unitform input::placeholder{color:var(--led-dim)}
.unitform input:focus{border-color:var(--accent);outline:none}
.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel-2);font-size:14px;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;min-height:74px}
.mcard:active{transform:scale(.98)}
.mcard .name{font-weight:700;font-size:13.5px;line-height:1.25}
.mcard .full{font-size:10.5px;color:var(--ink-3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:11px;color:var(--ink-2)}
.mcard .foot .u{color:var(--ink-3);font-size:10px}
.mcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.mcard.on{border-color:var(--accent)}

/* ---- judge header ---- */
.mhead{display:flex;align-items:center;gap:10px;padding:6px 2px 2px}
.mhead .name{font-size:21px;line-height:1.2}
.mhead .full{font-size:10.5px;color:var(--ink-3)}
.unitchip{font-size:11px;padding:4px 9px;border-radius:5px;background:var(--device);border:1px solid var(--device-line);white-space:nowrap;color:var(--led-label)}
.unitchip b{font-size:16px;color:var(--led);font-weight:400;margin-left:4px}

/* ---- result cluster ---- */
.result{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);padding:12px;margin:10px 0;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--none)}
.result.hot::before{background:var(--hot)} .result.warm::before{background:var(--warm)} .result.cool::before{background:var(--cool)}
.verdict{display:flex;align-items:flex-start;gap:12px}
.verdict .word{font-size:28px;line-height:1.15}
.verdict.hot .word{color:var(--hot-text)} .verdict.warm .word{color:var(--warm-text)} .verdict.cool .word{color:var(--cool-text)} .verdict.none .word{color:var(--ink-2)}
.verdict .why{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.gauge{margin:12px 0 4px}
.gauge .lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:4px}
.gauge .lab b{color:var(--ink);font-size:13px;font-weight:700}
.gauge .track{height:10px;border-radius:2px;background:var(--panel-3);position:relative;overflow:hidden;display:flex;gap:2px}
.gauge .seg{flex:1;background:var(--panel-3)}
.gauge .seg.on{background:var(--hot)} .gauge .seg.on.mid{background:var(--warm)} .gauge .seg.on.low{background:var(--cool)}
.gauge .ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 4px}
.kpi{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px}
.kpi .l{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.kpi .v{font-size:20px;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:400;color:var(--ink-3)}
.bars{margin:10px 0 2px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center}
.bar{display:contents}
.bar .l{font-size:11px;color:var(--ink-2)}
.bar .track{height:12px;background:var(--panel-3);border-radius:0 3px 3px 0;position:relative}
.bar .fill{height:100%;border-radius:0 3px 3px 0;background:var(--none);min-width:2px;transition:width .25s}
.bar.hot .fill{background:var(--hot)} .bar.warm .fill{background:var(--warm)} .bar.cool .fill{background:var(--cool)}
.bar.dead .fill{background:var(--none);opacity:.4}
.bar .v{font-size:11.5px;text-align:right;color:var(--ink-2);min-width:44px}
.bar.best .l,.bar.best .v{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .hot i{background:var(--hot)} .legend .warm i{background:var(--warm)} .legend .cool i{background:var(--cool)}
.evid{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line-2)}
.evid h3{font-size:10.5px;color:var(--ink-3);margin:0 0 6px;letter-spacing:.12em;text-transform:uppercase}
.evtable{width:100%;border-collapse:collapse;font-size:12px}
.evtable th{font-size:10px;color:var(--ink-3);font-weight:400;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line-2);letter-spacing:.06em}
.evtable td{padding:5px 4px;border-bottom:1px dashed var(--line-2);vertical-align:middle}
.evtable td.r{text-align:right;white-space:nowrap}
.evtable td.lab{max-width:120px}
.evtable .near{font-size:10px;color:var(--ink-3);display:block}
.scale{display:grid;grid-template-columns:auto 1fr auto;gap:5px;align-items:center;font-size:9.5px;color:var(--ink-3);min-width:110px}
.scale .tr{height:5px;background:var(--line);border-radius:3px;position:relative}
.scale .mk{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--panel);transform:translate(-50%,-50%)}
.scale .mk.edge{border-radius:2px;width:7px}
.foot{font-size:10.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}

/* ---- machine theme (壁紙=機種POP / テーマ色) ---- */
body.wall::before{content:"";position:fixed;inset:-24px;background:var(--wall) var(--wall-bgpos,center top)/cover no-repeat;opacity:.16;filter:blur(7px) saturate(1.15);z-index:-1;pointer-events:none}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) body.wall::before{opacity:.12} }
:root[data-theme="light"] body.wall::before{opacity:.12}
.hero{position:relative;margin:4px -10px 0;padding:0;min-height:196px;background:var(--panel-3) var(--hero-pos,center) / var(--hero-size,cover) no-repeat;border-bottom:1px solid var(--line-2);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.25) 45%, rgba(0,0,0,.72) 78%, var(--bg) 100%)}
.hero .hin{position:relative;display:flex;align-items:flex-end;gap:10px;padding:150px 12px 10px;color:#fff}
.hero .hin .name{font-size:24px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.hero .hin .full{font-size:10.5px;color:rgba(255,255,255,.78);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hero .hin .unitchip{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.25)}
.hero .hin .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.35)}
.hero .credit{position:relative;font-size:8.5px;color:rgba(255,255,255,.55);padding:0 12px 6px;text-align:right;letter-spacing:.02em}
.hero .tag{position:absolute;top:10px;left:12px;font-size:9.5px;letter-spacing:.14em;color:#fff;background:var(--accent);padding:2px 7px;border-radius:3px;font-weight:700;text-transform:uppercase}
.app.themed .card h2{color:var(--accent)} .app.themed .card h2::after{background:var(--accent-soft)}
.app.themed .device h2{color:var(--accent)}
.app.themed .segctl button.on,.app.themed .chip.on{border-color:var(--accent)}
.mcard.themed{border-left:3px solid var(--accent);background:linear-gradient(90deg, var(--panel-2) 52%, rgba(0,0,0,0) 100%), var(--wall) var(--card-pos,right center)/cover no-repeat var(--panel-2)}
.mcard.themed .name{color:var(--ink)}

/* ---- precision panel additions ---- */
.status{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}
.stchip{display:inline-flex;align-items:baseline;gap:4px;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;background:var(--panel-2);white-space:nowrap}
.stchip b{color:var(--ink);font-weight:600}
.stchip.hot b{color:var(--hot-text)} .stchip.cool b{color:var(--cool-text)}
.segctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.segctl button{border:0;background:transparent;padding:5px 10px;font-size:11.5px;color:var(--ink-2);line-height:1.2}
.segctl button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.prior{margin:12px 0 2px;padding:9px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--panel-2)}
.prior .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prior .ph .t{font-size:11px;color:var(--ink-2)}
.prior .ph .t b{color:var(--ink);font-weight:700}
.prior .strip{display:flex;height:9px;border-radius:2px;overflow:hidden;gap:1px;margin:7px 0 4px;background:var(--panel-3)}
.prior .strip i{display:block;height:100%;background:var(--none)}
.prior .strip i.cool{background:var(--cool)} .prior .strip i.warm{background:var(--warm)} .prior .strip i.hot{background:var(--hot)}
.prior .pv{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3)}
.prior .pv span b{color:var(--ink-2);font-weight:400}
.prior .pm{font-size:10px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.bar .track .pmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55;transform:translateX(-1px)}
.lr{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;white-space:nowrap}
.lr .lb{width:34px;height:6px;background:var(--panel-3);border-radius:2px;position:relative;overflow:hidden;flex:none}
.lr .lb i{position:absolute;top:0;bottom:0;background:var(--none);left:50%;width:0}
.lr.hot .lb i{background:var(--hot);left:50%} .lr.cool .lb i{background:var(--cool);left:auto;right:50%}
.lr.hot{color:var(--hot-text)} .lr.cool{color:var(--cool-text)} .lr.none{color:var(--ink-3)}
.kpis.four{grid-template-columns:1fr 1fr}
.dfield .rate .z{color:var(--led);margin-left:4px}
.gate[hidden],[hidden]{display:none!important}
.gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.gatebox input[type=password]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--device);color:var(--led);font-size:18px;letter-spacing:.08em;margin:10px 0 8px}
.gatebox .row{font-size:12px;color:var(--ink-2);margin-bottom:10px;gap:6px}
.gatebox input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel-2);color:var(--ink);font-size:16px;margin:10px 0 0}
.logtable td,.logtable th{text-align:left;white-space:normal}
.logtable td.num{white-space:nowrap}
.gatebox .msg{font-size:11.5px;color:var(--warm-text);min-height:1.4em;margin-top:8px}

/* ---- counter device ---- */
.device{background:var(--device);border:1px solid var(--device-line);border-radius:8px;padding:11px;color:#E6EAEE}
.device h2{color:var(--led-label);font-size:10.5px;margin:0 0 10px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.device h2::after{content:"";flex:1;height:1px;background:var(--device-line)}
.device h2 .n{color:#5F6975;margin-left:0;font-weight:400;letter-spacing:0;text-transform:none}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dfield{background:var(--device-2);border:1px solid var(--device-line);border-radius:6px;padding:7px 9px 6px;position:relative}
.dfield.wide{grid-column:1 / -1}
.dfield label{display:block;font-size:10.5px;color:var(--led-label);letter-spacing:.06em}
.dfield label .imp{color:var(--led);margin-left:4px}
.dfield input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--device-line);color:var(--led);font-size:28px;line-height:1.1;padding:2px 0;text-align:right;letter-spacing:.04em}
.dfield input::placeholder{color:var(--led-dim)}
.dfield input:focus{outline:none;border-bottom-color:var(--led)}
.dfield .tools{display:grid;grid-template-columns:1fr 2fr auto;gap:5px;align-items:center;margin-top:6px}
.dfield .tools.one{grid-template-columns:1fr auto}
.dfield .plus,.dfield .minus1{background:#161C23;border:1px solid #2A333D;color:var(--led);border-radius:5px;padding:7px 0;font-size:14px;font-weight:700}
.dfield .minus1{color:#8E98A3}
.dfield .plus:active,.dfield .minus1:active{background:#22292F}
.dfield .help{background:none;border:1px solid #2A333D;color:#8E98A3;border-radius:5px;width:30px;height:30px;font-size:12px}
.dfield .helptext{font-size:10.5px;color:#AEB7C0;margin-top:6px;line-height:1.5}
.dfield .helptext.hid{display:none}

/* ---------- ログイン履歴(誰がどの端末から): この端末に保存し、共有ログ(GitHub issue)が設定されていれば送る ---------- */
var MODE = (document.querySelector('meta[name="snv-mode"]')||{}).content || 'inline';
var VERSION = (document.querySelector('meta[name="snv-version"]')||{}).content || 'inline';
var LOGCFG = null;

function userName(){ try{ return localStorage.getItem('snv:name')||''; }catch(e){ return ''; } }
function setUserName(n){ try{ localStorage.setItem('snv:name', String(n||'').trim().slice(0,20)); }catch(e){} }
function deviceId(){ var id = null; try{ id = localStorage.getItem('snv:devid'); if(!id){ id = Math.random().toString(16).slice(2,10); localStorage.setItem('snv:devid', id); } }catch(e){ id = 'unknown'; } return id; }

  var ua = navigator.userAgent || '', os = 'その他', br = 'ブラウザ', model = '';
  if(/iPhone/.test(ua)) os = 'iPhone'; else if(/iPad/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)) os = 'iPad'; else if(/Android/.test(ua)) os = 'Android'; else if(/Windows/.test(ua)) os = 'Windows'; else if(/Mac OS X/.test(ua)) os = 'Mac';
  var v = ua.match(/(?:iPhone|CPU) OS (\d+[_.]\d+)/) || ua.match(/Android (\d+(?:\.\d+)?)/) || ua.match(/Windows NT (\d+\.\d+)/) || ua.match(/Mac OS X (\d+[_.]\d+)/); if(v) os += ' ' + v[1].replace('_','.');
  if(/Android/.test(ua)){ var mm = ua.match(/Android [^;]+; ([^;)]+)\)/); if(mm) model = mm[1].replace(/ Build.*/,'').trim(); }
  if(/Edg\//.test(ua)) br='Edge'; else if(/CriOS/.test(ua)) br='Chrome(iOS)'; else if(/Line\//.test(ua)) br='LINE内ブラウザ'; else if(/Chrome\//.test(ua)) br='Chrome'; else if(/Safari\//.test(ua)) br='Safari'; else if(/Firefox|FxiOS/.test(ua)) br='Firefox';
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
  var tz = ''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  return {id: deviceId(), os: os, model: model, browser: br, screen: screen.width+'×'+screen.height, lang: navigator.language||'', tz: tz, app: standalone?'ホーム画面':'ブラウザ'};
}
function devLabel(d){ return [d.os, d.model, d.browser, d.app].filter(Boolean).join(' / '); }
function fmtT(iso){ var d = new Date(iso); if(isNaN(d)) return iso; var p=function(n){return (n<10?'0':'')+n;}; return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function kindLabel(k){ return {unlock:'解錠', auto:'自動解錠', fail:'失敗', open:'起動'}[k]||k; }
function logLine(e){ return fmtT(e.t)+' '+(e.name||'(名前なし)')+'｜'+devLabel(e.dev||{})+' '+((e.dev||{}).screen||'')+'｜端末 '+((e.dev||{}).id||'?')+'｜'+kindLabel(e.kind)+(e.mode==='pwa'?'':'（'+e.mode+'）'); }
function readLog(){ return lget('snv:log')||[]; }
function addLog(kind, extra){
  var e = {t: new Date().toISOString(), kind: kind, name: userName(), dev: deviceInfo(), ver: VERSION, mode: MODE};
  if(extra) for(var k in extra) e[k] = extra[k];
  var log = readLog(); log.push(e); if(log.length>300) log = log.slice(-300); lset('snv:log', log);
  var box = lget('snv:outbox')||[]; box.push(e); if(box.length>100) box = box.slice(-100); lset('snv:outbox', box);
  flushLog(); return e;
}
var flushing = false;
function ghHeaders(){ return {'Authorization':'Bearer '+LOGCFG.token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}; }
function flushLog(){
  if(!LOGCFG || flushing || navigator.onLine===false) return; var box = lget('snv:outbox')||[]; if(!box.length) return;
  flushing = true;
  var body = box.map(function(e){ return '- ' + logLine(e); }).join('\n') + '\n\n<!-- snvlog ' + JSON.stringify(box) + ' -->';
  fetch('https://api.github.com/repos/'+LOGCFG.repo+'/issues/'+LOGCFG.issue+'/comments', {method:'POST', headers:ghHeaders(), body: JSON.stringify({body: body})})
    .then(function(r){ if(r.ok){ var cur = lget('snv:outbox')||[]; lset('snv:outbox', cur.slice(box.length)); } })
    .catch(function(){}).then(function(){ flushing = false; });
}
function fetchCentralLog(cb){
  if(!LOGCFG) return cb(null, []);
  var all = [], page = 1;
  function next(){
    fetch('https://api.github.com/repos/'+LOGCFG.repo+'/issues/'+LOGCFG.issue+'/comments?per_page=100&page='+page, {headers:ghHeaders()})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(list){ list.forEach(function(c){ var m = /<!-- snvlog (\[[\s\S]*?\]) -->/.exec(c.body||''); if(m){ try{ JSON.parse(m[1]).forEach(function(e){ all.push(e); }); }catch(e){} } });
        if(list.length===100 && page<5){ page++; next(); } else { all.sort(function(a,b){ return a.t<b.t?1:(a.t>b.t?-1:0); }); cb(null, all); } })
      .catch(function(err){ cb(err, all); });
  }
  next();
}
window.addEventListener('online', function(){ flushLog(); });

function boot(DATA, HIST, EXTRA){

var byId = {}; MACHINES.forEach(function(m){ byId[m.id] = m; });
var byAnaslo = {}; MACHINES.forEach(function(m){ (m.anaslo_names||[]).forEach(function(n){ byAnaslo[n] = m; }); });
var unitCounts = {}, unitRanges = {};
Object.keys(HIST.unit_machine).forEach(function(u){
  var n = HIST.unit_machine[u]; var m = byAnaslo[n]; if(!m) return;
  unitCounts[m.id] = (unitCounts[m.id]||0)+1;
  var r = unitRanges[m.id] || (unitRanges[m.id] = {min:u,max:u});
  if(u < r.min) r.min = u; if(u > r.max) r.max = u;
});

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var x = parseFloat(String(v==null?'':v).replace(/,/g,'')); return isFinite(x) && x>0 ? x : 0; }
function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function fmtInv(n,k){ return k>0 ? '1/' + (n/k).toFixed(1) : '—'; }
function pct(x){ return (x*100).toFixed(x*100 >= 10 ? 0 : 1) + '%'; }
function sIdx(m, s){ return m.settings.indexOf(s); }
function sNum(s){ return s === 'V' ? 5 : parseInt(s,10); }
function tierOf(m, s){ var v = sNum(s); return v>=4 ? 'hot' : (v===3 ? 'warm' : 'cool'); }
function isHigh(m,s){ return tierOf(m,s)==='hot'; }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }
function lineUrl(text){ return 'https://line.me/R/share?text=' + encodeURIComponent(text); }
function copyText(txt, ta){
  // クリップボードへ。使えないときは ta(無ければ一時的な入力欄)を選択して execCommand で写す
  var done = function(){ toast('コピーしました'); };
  var fail = function(){
    var el = ta, tmp = null;
    if(!el){ tmp = el = document.createElement('textarea'); tmp.value = txt; tmp.setAttribute('readonly', ''); tmp.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0'; document.body.appendChild(tmp); }
    el.focus(); el.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('長押しでコピーしてください'); }
    if(tmp) document.body.removeChild(tmp);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail); else fail();
}

/* ---------- state ---------- */
var S = store('sn:app') || {view:'home', machineId:null, unit:''};
if(S.prior!=='flat') S.prior = 'hall';
function stateKey(){ return 'sn:' + (S.machineId||'-') + ':' + (S.unit||'-'); }
function blankInput(){ return {games:'', at_games:'', counts:{}, denoms:{}, hints:{}, memo:'', sample:false}; }
var IN = null;
function loadInput(){ IN = store(stateKey()) || blankInput(); if(!IN.counts) IN.counts={}; if(!IN.denoms) IN.denoms={}; if(!IN.hints) IN.hints={}; }
function saveInput(){ store(stateKey(), IN); store('sn:app', S); }

/* ---------- engine ---------- */
function priorOf(m){ return (S.prior==='hall' && m.prior && m.prior.p) ? m.prior.p : null; }
function lrOf(m, f, pri){
  // f: {設定: 対数尤度(または対数の重み)} → 高設定(4以上) 対 低設定(3以下) の尤度比。事前配分があればその重みで平均する
  var hi=0, lo=0, whi=0, wlo=0, mx=-Infinity;
  m.settings.forEach(function(s){ if(f[s]>mx) mx=f[s]; });
  m.settings.forEach(function(s){ var w = pri ? pri[s] : 1; var v = w*Math.exp(f[s]-mx); if(isHigh(m,s)){ hi+=v; whi+=w; } else { lo+=v; wlo+=w; } });
  if(!whi||!wlo) return null;
  return (hi/whi)/(lo/wlo);
}
function compute(m, IN){
  var S6 = m.settings, logL = {}, dead = {}, evid = [], anyHard = false, hardMin = null, hardOnly = null, denies = [];
  var pri = priorOf(m);
  S6.forEach(function(s){ logL[s] = 0; dead[s] = false; });
  var games = num(IN.games), atg = num(IN.at_games);
  var normal = Math.max(0, games - atg);
  var atUnknown = (m.type==='at' && games>0 && atg===0);
  m.counters.forEach(function(c){
    var k = Math.floor(num(IN.counts[c.key]));
    var n;
    if(c.denom==='games') n = games; else if(c.denom==='normal') n = normal; else { n = num(IN.denoms[c.key]); if(!n && c.key==='grape' && k>0) n = games; }
    n = Math.floor(n);
    if(!n) return;
    if(k > n) k = n;
    var touched = (k>0) || (IN.counts[c.key]!=='' && IN.counts[c.key]!=null);
    if(!touched) return;
    var ll = {};
    S6.forEach(function(s){ var p = c.p[s]; var v = k*Math.log(p) + (n-k)*Math.log(1-p); logL[s] += v; ll[s]=v; });
    var obs = k>0 ? n/k : null; var near = null, bestd = Infinity;
    S6.forEach(function(s){ var th = 1/c.p[s]; var d = obs ? Math.abs(Math.log(obs)-Math.log(th)) : Infinity; if(d<bestd){bestd=d;near=s;} });
    evid.push({c:c, k:k, n:n, obs:obs, near:near, ll:ll, lr:lrOf(m, ll, pri)});
  });
  var hintsUsed = [], recorded = [];
  m.hints.forEach(function(g, gi){ g.items.forEach(function(it, ii){
    var cnt = IN.hints[gi+'_'+ii]|0; if(!cnt) return;
    var e = it.effect; if(e.type==='info'){ recorded.push({g:g, it:it, cnt:cnt}); return; }
    var f = {}; S6.forEach(function(s){ f[s]=0; });
    var hard = false;
    if(e.type==='evenonly'){ hard=true; S6.forEach(function(s){ if(sNum(s)%2===1) dead[s]=true; }); }
    else if(e.type==='oddonly'){ hard=true; S6.forEach(function(s){ if(sNum(s)%2===0) dead[s]=true; }); }
    else if(e.type==='min'){ hard=true; hardMin = Math.max(hardMin||0, e.k); S6.forEach(function(s){ if(sNum(s) < e.k) dead[s]=true; }); }
    else if(e.type==='only'){ hard=true; hardOnly = e.k; S6.forEach(function(s){ if(sNum(s) !== e.k) dead[s]=true; }); }
    else if(e.type==='deny'){ hard=true; e.ks.forEach(function(k){ denies.push(k); S6.forEach(function(s){ if(sNum(s)===k) dead[s]=true; }); }); }
    else if(e.type==='odd'){ S6.forEach(function(s){ if(sNum(s)%2===1) f[s] = cnt*Math.log(e.w); }); }
    else if(e.type==='even'){ S6.forEach(function(s){ if(sNum(s)%2===0) f[s] = cnt*Math.log(e.w); }); }
    else if(e.type==='high'){ S6.forEach(function(s){ if(isHigh(m,s)) f[s] = cnt*Math.log(e.w); }); }
    else if(e.type==='set'){ S6.forEach(function(s){ if(e.ks.indexOf(sNum(s))>=0) f[s] = cnt*Math.log(e.w); }); }
    else if(e.type==='weights'){ S6.forEach(function(s){ var w = e.w[s]; if(w==null) w = 1; f[s] = cnt*Math.log(Math.max(w,1e-9)); }); }
    if(hard) anyHard = true; else S6.forEach(function(s){ logL[s] += f[s]; });
    hintsUsed.push({g:g, it:it, cnt:cnt, hard:hard, lr: hard ? null : lrOf(m, f, pri)});
  }); });
  var alive = S6.filter(function(s){ return !dead[s]; });
  var post = {}, flat = {};
  var hasAny = evid.length>0 || hintsUsed.length>0;
  if(alive.length){
    var lp = function(s){ return logL[s] + (pri ? Math.log(Math.max(pri[s],1e-6)) : 0); };
    var mx = -Infinity; alive.forEach(function(s){ if(lp(s)>mx) mx=lp(s); });
    var sum = 0; alive.forEach(function(s){ post[s] = Math.exp(lp(s)-mx); sum += post[s]; });
    alive.forEach(function(s){ post[s] /= sum; }); S6.forEach(function(s){ if(dead[s]) post[s]=0; });

  }

  var top = null; S6.forEach(function(s){ if(top===null || (post[s]||0) > (post[top]||0)) top = s; });
  return {post:post, flat:flat, dead:dead, alive:alive, pHigh:pHigh, pHighFlat:pHighFlat, pLow:pLow, top:top, games:games, normal:normal, atUnknown:atUnknown, prior:pri, hasAny:hasAny,
          lrAll: hasAny ? lrOf(m, logL, pri) : null,
          evid:evid, hints:hintsUsed, recorded:recorded, anyHard:anyHard, hardMin:hardMin, hardOnly:hardOnly, denies:denies, contradiction: alive.length===0};
}
function sampleTier(m, R){
  var g = m.type==='at' ? R.normal : R.games;
  var th = m.type==='at' ? [1000,3000,5000] : [500,1500,3000];
  var i = 0; while(i<th.length && g>=th[i]) i++;
  var labels = ['まだ少ない','出はじめ','そこそこ','十分'];
  return {i:i, label:labels[i], next: i<th.length ? th[i]-g : 0, g:g};
}

/* ---------- render: result ---------- */
function verdict(m, R, T){
  var w, why, cls;
  var hasEvidence = R.evid.length>0 || R.hints.length>0;
  if(R.contradiction){ return {w:'示唆が矛盾', why:'入力した示唆どうしが両立しません。別の台の演出が混ざっていないか見直してください。', cls:'none'}; }
  if(R.hardOnly){ return {w:'設定'+R.hardOnly+'濃厚', why:'設定'+R.hardOnly+'を示す確定系の演出が出ています。これ以上の判別は不要です。', cls: isHigh(m, String(R.hardOnly===5&&m.settings.indexOf('V')>=0?'V':R.hardOnly))?'hot':'warm'}; }
  if(!hasEvidence){ return {w:'入力待ち', why:'データカウンタの数字を入れると、設定ごとの確率が出ます。', cls:'none'}; }
  var lead = '';
  if(R.hardMin){ lead = '設定'+R.hardMin+'以上濃厚の演出あり。'; }
  if(R.denies.length){ lead += '設定'+R.denies.join('・')+'は否定。'; }
  if(T.i===0 && !R.hardMin && R.hints.length===0){
    return {w:'まだ判断できない', why:'回転数が少なすぎます（'+fmt(T.g)+'G）。'+(m.type==='at'?'AT機は最低1,000G':'ジャグラーは最低500G')+'、できれば'+(m.type==='at'?'3,000G':'1,500G')+'以上で見てください。', cls:'none'};
  }
  var p = R.pHigh;
  if(R.hardMin && R.hardMin>=4){ w='設定'+R.hardMin+'以上濃厚'; cls='hot'; }
  else if(p>=0.75){ w='高設定に期待'; cls='hot'; }
  else if(p>=0.55){ w='やや高設定寄り'; cls='hot'; }
  else if(p<=0.2){ w='低設定寄り'; cls='cool'; }
  else if(p<=0.4){ w='やや低設定寄り'; cls='cool'; }
  else { w='五分五分'; cls='warm'; }
  why = lead + '設定4以上の確率 ' + pct(p) + (R.prior ? '（この店の実績配分を加味。均等前提なら ' + pct(R.pHighFlat) + '）。' : '（全設定が同じ割合で使われていると仮定）。');
  if(T.i<=1) why += ' サンプルはまだ' + T.label + 'なので、結論は保留気味に。';
  return {w:w, why:why, cls:cls};
}
function lrParts(lr){
  if(lr==null || !isFinite(lr)) return null;
  var hi = lr>=1, v = hi ? lr : 1/lr;
  var txt = v>=9999 ? '×9999+' : v>=100 ? '×'+Math.round(v) : v>=10 ? '×'+v.toFixed(0) : '×'+v.toFixed(1);
  return {hi:hi, v:v, txt:txt, neutral:v<1.15, w:Math.min(1, Math.log10(Math.max(v,1))/3)*100};
}
function lrText(lr){ var q = lrParts(lr); if(!q) return '—'; return q.neutral ? '中立' : (q.hi?'高 ':'低 ')+q.txt; }
function lrCell(lr){
  var q = lrParts(lr); if(!q) return '<span class="lr none">—</span>';
  var cls = q.neutral ? 'none' : (q.hi ? 'hot' : 'cool');
  return '<span class="lr '+cls+'"><span class="lb"><i style="width:'+(q.neutral?0:q.w).toFixed(0)+'%"></i></span>'+esc(lrText(lr))+'</span>';
}
function evidenceRow(m, e){
  var c = e.c, s1 = m.settings[0], sT = m.settings[m.settings.length-1];
  var isPct = /%$/.test(c.disp[s1]);
  var obsTxt = e.k>0 ? (isPct ? (e.k/e.n*100).toFixed(1)+'%' : fmtInv(e.n,e.k)) : (isPct ? '0%' : '0回');
  var d1 = 1/c.p[s1], dT = 1/c.p[sT];
  var x1 = Math.log(d1), xT = Math.log(dT), pos = null, edge = '';
  if(e.obs){ var x = Math.log(e.obs); var t = (x - x1)/(xT - x1); if(t<0){pos=0;edge='edge';} else if(t>1){pos=1;edge='edge';} else pos=t; }
  else if(e.n>0){ pos = 0; edge='edge'; }
  var near = '';
  if(e.k>0 && e.near){ near = (d1===dT) ? (e.obs < d1 ? '理論値より良い（設定差なし）' : e.obs > d1 ? '理論値より悪い（設定差なし）' : '理論値どおり') : (e.obs < dT ? '設定'+sT+'より良い' : (e.obs > d1 ? '設定'+s1+'より悪い' : '設定'+e.near+'相当')); }
  else if(e.n>0){ near = '0回'; }
  return '<tr><td class="lab"><b>'+esc(c.label)+'</b>'+(c.approx?' <span class="badge">目安</span>':'')+'<span class="near">'+esc(near)+'</span></td>'+
    '<td class="r num">'+fmt(e.k)+'<span class="sub">/'+fmt(e.n)+(c.denom==='own'&&isPct?'回':'G')+'</span><br><b>'+obsTxt+'</b></td>'+
    '<td><div class="scale"><span class="num">'+esc(c.disp[s1])+'</span><div class="tr">'+(pos!=null?'<span class="mk '+edge+'" style="left:'+(pos*100).toFixed(1)+'%"></span>':'')+'</div><span class="num">'+esc(c.disp[sT])+'</span></div></td>'+
    '<td class="r">'+lrCell(e.lr)+'</td></tr>';
}
function memoText(m, R, T, V){
  var d = new Date(), pad = function(n){ return (n<10?'0':'')+n; };
  var head = '【総合判定ツール】' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  var lines = [head, m.short + (S.unit ? '　台番 ' + S.unit : '')];
  var hasAny = R.evid.length || R.hints.length;
  lines.push('判定: ' + V.w + (hasAny && !R.contradiction ? '（設定4以上 ' + pct(R.pHigh) + '）' : ''));
  if(hasAny) lines.push('前提: ' + (R.prior ? '店の実績配分(推定)' : '全設定均等') + (R.lrAll!=null ? '　高/低 尤度比 ' + lrText(R.lrAll) : ''));
  var games = num(IN.games), atg = num(IN.at_games);
  if(games) lines.push('総回転数 ' + fmt(games) + 'G' + (m.type==='at' && atg ? '（AT中 ' + fmt(atg) + 'G を除外）' : '') + '　サンプル: ' + T.label);
  R.evid.forEach(function(e){ var c = e.c, isPct = /%$/.test(c.disp[m.settings[0]]);
    var obs = e.k>0 ? (isPct ? (e.k/e.n*100).toFixed(1)+'%' : fmtInv(e.n,e.k)) : '0回';

['rate','th','sel','g','prev','rsel','st','memo'].forEach(function(k){ if(!A[k] || typeof A[k]!=='object' || Array.isArray(A[k])) A[k] = {}; });

function f1(v){ return (v==null || !isFinite(v)) ? '—' : (Math.round(v*10)/10).toFixed(1); }
function lerp(a, b, t){ return a + (b-a)*t; }
function safeUrl(u){ u = String(u||''); return /^https?:\/\//i.test(u) ? u : ''; }
function stripName(title, name){
  // 表の題から先頭の機種名を外す(空白の有無は無視して照合)
  title = String(title||''); name = String(name||'').replace(/\s+/g,''); if(!name) return title.trim();
  var i = 0, j = 0;
  while(i<title.length && j<name.length){ var c = title.charAt(i); if(/\s/.test(c)){ i++; continue; } if(c!==name.charAt(j)) return title.trim(); i++; j++; }
  return j===name.length ? (title.slice(i).trim() || title.trim()) : title.trim();
}
function srcName(M){
  if(M.src) return String(M.src);
  if(M.source) return typeof M.source==='string' ? M.source : String(M.source.name||'');
  var u = String(M.url||''); if(/slolaboratory\.com/.test(u)) return 'すろらぼ';
  var h = /^https?:\/\/([^\/]+)/.exec(u); return h ? h[1] : '出典の記載なし';
}

/* ---------- 狙い目: 交換率 ---------- */
function rnum(v, d){ var x = numOr(v, NaN); return (isFinite(x) && x>=10 && x<=1000) ? x : d; }
function rateNow(){ return rateOf(A.rate); }
function rateOf(r){
  // 交換率の設定 {preset, kashi, kokan, ck} → 計算に使う形。画面の選択(A.rate)と「聞く」の質問文の交換率で共通
  var p = r.preset;
  if(p==='50_50') return {id:p, kashi:50, kokan:50, label:'等価（50枚貸し・50枚交換）', short:'等価'};
  if(p==='chodama'){ var k = rnum(r.ck, 51); return {id:p, kashi:k, kokan:k, chodama:true, label:'貯メダル再プレイ（投資も交換も'+k+'枚で計算）', short:'貯メダル'+k+'枚'}; }
  if(p==='custom'){ var a = rnum(r.kashi, 50), b = rnum(r.kokan, 50); return {id:p, kashi:a, kokan:b, label:a+'枚貸し・'+b+'枚交換', short:a+'-'+b}; }
  return {id:'46_51', kashi:46, kokan:51, label:'46枚貸し・51枚交換', short:'46-51'};
}
function parseRate(s){
  // 「等価」「46枚貸し51枚交換」「46-52」「5.6枚交換」「k46_o51」などを {kashi, kokan}(1000円あたりの枚数) に直す。読めなければ null
  s = String(s==null?'':s); var m;
  if((m = /k(\d+(?:\.\d+)?)_o(\d+(?:\.\d+)?)/i.exec(s))) return {kashi:+m[1], kokan:+m[2]};
  if(/貯メダル|貯玉|再プレイ/.test(s)) return {kashi:50, kokan:50, chodama:true};
  var nums = (s.replace(/\d+(?:\.\d+)?\s*円/g, ' ').match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(function(x){ return x>=4 && x<=1000; });
  var up = function(x){ return x<10 ? Math.round(x*100)/10 : x; };     // 5.6枚(100円あたり) → 56枚(1000円あたり)
  var mk = /(\d+(?:\.\d+)?)\s*枚?\s*貸/.exec(s), mo = /(\d+(?:\.\d+)?)\s*枚?\s*(?:交換|換金)/.exec(s);
  if(mk && mo && +mk[1]>=4 && +mo[1]>=4) return {kashi:up(+mk[1]), kokan:up(+mo[1])};   // 「46枚貸し51枚交換」「51枚交換(46枚貸し)」など語で判定
  if(nums.length>=2) return {kashi:up(nums[0]), kokan:up(nums[1])};
  if(/等価/.test(s) && !/非等価/.test(s)) return {kashi:50, kokan:50};
  if(nums.length===1) return {kashi:50, kokan:up(nums[0])};
  return null;
}
function rateDist(a, b){ if(!a || !b) return Infinity; return Math.abs(Math.log(a.kokan/a.kashi) - Math.log(b.kokan/b.kashi)); }
function rateText(pr, raw){ if(!pr) return String(raw||''); if(pr.chodama) return '貯メダル'; if(pr.kashi===50 && pr.kokan===50) return '等価'; return pr.kashi+'枚貸し・'+pr.kokan+'枚交換'; }

/* ---------- 狙い目: 計算式(ここ1か所) ----------
   行 r = {g:打ち始めG, inv:投資枚, get:AT獲得枚, ng:通常時の消化G, tg:総消化G, n:サンプル数}
   tenjo.json の機種に formula_id があり、下の表に無い値なら 基本式(basic) で計算して画面に「参考」と出す */
var FORMULAS = {
  basic: {
    ev: function(r, rate, M){ return r.get*1000/rate.kokan - r.inv*1000/rate.kashi; },
    payout: function(r, M){ if(!(r.tg>0)) return null; return (r.tg*3 - r.inv + r.get)/(r.tg*3)*100; },     // 出玉率 =（総消化G×3 − 投資枚 ＋ 獲得枚）÷（総消化G×3）
    minutes: function(r, M){ return r.tg/800*60; },
    hit: function(r, M){ return r.hit!=null ? r.hit : (r.ng>0 ? r.ng : null); },     // 初当りの目安: 表に hit(分母)があればそれ、無ければ 1/ng
    text: function(r, rate, M){ return '獲得 '+f1(r.get)+'枚'+(hasCoef(M)?'(補正後)':'')+'×1000÷'+rate.kokan+' − 投資 '+f1(r.inv)+'枚×1000÷'+rate.kashi; }
  }
};
function hasCoef(M){ var c = +M.coef; return isFinite(c) && c>0 && Math.abs(c-1)>1e-9; }
function formulaOf(M){
  var id = M.formula_id;
  if(id==null || id==='' || id==='basic' || id==='static') return {f:FORMULAS.basic, known:true, id:String(id||'basic')};
  if(FORMULAS[id]) return {f:FORMULAS[id], known:true, id:id};
  return {f:FORMULAS.basic, known:false, id:String(id)};
}

/* ---------- 狙い目: 表・状態・セレクタ ---------- */
function byG(a, b){ return a.g-b.g; }
function rowsOf(tb){
  if(tb._rows) return tb._rows;
  var out = [], hits = Array.isArray(tb.hit) ? tb.hit : null;
  (tb.rows||[]).forEach(function(a, i){
    if(!a) return;
    var r = Array.isArray(a) ? {g:+a[0], inv:+a[1], get:+a[2], ng:+a[3], tg:+a[4], n:+a[5]} : {g:+a.g, inv:+a.inv, get:+a.get, ng:+a.ng, tg:+a.tg, n:+a.n};
    if(!isFinite(r.g) || !isFinite(r.inv) || !isFinite(r.get) || !isFinite(r.ng) || !(r.tg>0) || !(r.n>0)) return;   // サンプル0の行は使わない
    var h = hits ? +hits[i] : (a && !Array.isArray(a) ? +a.hit : NaN); r.hit = (isFinite(h) && h>0) ? h : null;
    out.push(r);
  });
  out.sort(byG); tb._rows = out; return out;
}
function srowsOf(st){
  if(st._rows) return st._rows;
  var out = [];
  (st.rows||[]).forEach(function(r){
    if(!r) return; var g = parseFloat(String(r.g).replace(/,/g,'')), ev = numOr(r.ev, NaN);
    if(!isFinite(g) || !isFinite(ev)) return;
    out.push({g:g, ev:ev, payout:numOr(r.payout, null), min:numOr(r.min, null), hourly:numOr(r.hourly, null), hit:numOr(r.hit, null), n:numOr(r.n, null)});
  });
  out.sort(byG); st._rows = out; return out;
}
function lowN(p){ return p.n!=null && p.n<A.th.nmin; }      // サンプルが少ない(n が不明の表は少ないとは扱わない)
function nText(p){ return p.n==null ? '—' : fmt(p.n); }
function optV(o){ return (o && typeof o==='object') ? String(o.v) : String(o); }
function optT(o){ return (o && typeof o==='object') ? String(o.t!=null ? o.t : o.v) : String(o); }
function optText(sel, v){ var os = (sel && sel.options)||[]; for(var i=0;i<os.length;i++){ if(optV(os[i])===v) return optT(os[i]); } return v; }
function cleanLabel(s){ return String(s==null?'':s).replace(/<br\s*\/?>/gi,'').replace(/<[^>]*>/g,''); }
function smartSplit(key, sels){
  // 選択肢の値そのものに「,」が入っている場合に備えて、左から選択肢の値で照合する
  var res = [], pos = 0;
  for(var i=0;i<sels.length;i++){
    var last = (i===sels.length-1), vals = ((sels[i].options||[]).map(optV)).concat(['']);
    vals.sort(function(a,b){ return b.length-a.length; });
    var hit = null;
    for(var j=0;j<vals.length;j++){ var v = vals[j]; if(key.substr(pos, v.length)===v && (last ? pos+v.length===key.length : key.charAt(pos+v.length)===',')){ hit = v; break; } }
    if(hit===null) return null;
    res.push(hit); pos += hit.length+1;
  }
  return res;
}
function staticGroups(M){
  // static を題ごとにまとめる(出現順)。題を空白で区切った語を、セレクタの選択値として使う
  if(M._sgroups) return M._sgroups;
  var groups = [], seen = {};
  (M.static||[]).forEach(function(st){ var t = String(st.title||''); if(seen[t]){ seen[t].list.push(st); return; } var g = {title:t, list:[st], toks:t.split(/\s+/).filter(Boolean)}; seen[t] = g; groups.push(g); });
  var n = 0; groups.forEach(function(g){ n = Math.max(n, g.toks.length); });
  var sels = [];
  if(groups.length>1){
    for(var i=0;i<n;i++){
      var vals = []; groups.forEach(function(g){ var v = g.toks[i]||''; if(v && vals.indexOf(v)<0) vals.push(v); });
      var lab = commonAffix(vals) || (i===0 ? '分類' : '条件'+(i+1)); if(lab==='スルー') lab = 'スルー回数';
      sels.push({label:lab, options:vals});
    }
  }
  groups.forEach(function(g){ var parts = []; for(var i=0;i<n;i++) parts.push(g.toks[i]||''); g.key = parts.join(','); g.parts = parts; });
  M._sgroups = groups; M._sels = sels; return groups;
}
function commonAffix(vals){
  if(vals.length<2) return '';
  var pre = vals[0], suf = vals[0];
  vals.forEach(function(v){ var i = 0; while(i<pre.length && i<v.length && pre.charAt(i)===v.charAt(i)) i++; pre = pre.slice(0, i); var j = 0; while(j<suf.length && j<v.length && suf.charAt(suf.length-1-j)===v.charAt(v.length-1-j)) j++; suf = suf.slice(suf.length-j); });
  pre = pre.replace(/[0-9０-９+\-−～〜]+$/, ''); suf = suf.replace(/^[0-9０-９+\-−～〜]+/, '');
  if(pre.length>=2) return pre; if(suf.length>=2) return suf; return '';
}
function selsOf(M){ if(!(M.tables && M.tables.length) && M.static && M.static.length){ staticGroups(M); return M._sels||[]; } return M.selectors||[]; }
function convOf(M){
  if(M._conv) return M._conv;
  var sels = M.selectors||[], n = sels.length, tables = M.tables||[], out = [];
  if(!tables.length && M.static && M.static.length){
    var groups = staticGroups(M);
    if((M._sels||[]).length) groups.forEach(function(g, i){ out.push({key:g.key, parts:g.parts, idx:i}); });
    M._conv = out; return out;
  }
  if(n && M.conv && typeof M.conv==='object'){
    Object.keys(M.conv).forEach(function(key){
      var idx = M.conv[key]; if(!tables[idx]) return;
      var parts = key.split(',');
      if(parts.length!==n){ parts = smartSplit(key, sels) || parts.slice(0, n); while(parts.length<n) parts.push(''); }
      out.push({key:key, parts:parts, idx:idx});
    });
  }
  M._conv = out; return out;
}
function statesOf(M){
  // 状態の一覧。セレクタ(conv)がある機種は組合せごと、無い機種は表ごと、static だけの機種は題ごと
  if(M._states) return M._states;
  var out = [], sels = selsOf(M);
  if(M.tables && M.tables.length){
    var conv = convOf(M);
    if(conv.length){
      conv.forEach(function(c){
        var tb = M.tables[c.idx], txt = [];
        c.parts.forEach(function(v, i){ if(v!=='') txt.push(optText(sels[i], v)); });
        out.push({id:'c:'+c.key, kind:'table', tb:tb, parts:c.parts, label:txt.join(' / '), title:String(tb.title||''), reset:RESET_RE.test(txt.join(' ')+' '+(tb.title||''))});
      });
    } else {
      M.tables.forEach(function(tb, i){ out.push({id:'t:'+i, kind:'table', tb:tb, parts:null, label:stripName(tb.title||('表'+(i+1)), M.name), title:String(tb.title||''), reset:RESET_RE.test(String(tb.title||''))}); });
    }
  } else if(M.static && M.static.length){
    var groups = staticGroups(M), sconv = convOf(M);
    groups.forEach(function(g, i){
      var lab = stripName(g.title, M.name) || '期待値表';
      out.push({id:(sconv.length ? 'c:'+g.key : 's:'+i), kind:'static', list:g.list, parts:(sconv.length ? g.parts : null), label:lab, title:g.title, reset:RESET_RE.test(g.title)});
    });
  }
  M._states = out; return out;
}
function resolveSel(M, want, prefer){
  // 保存してある選択(want)を conv に合わせて有効な組合せに直す。cands[i] = そのセレクタでいま選べる値('' だけなら非表示)
  var conv = convOf(M), sels = selsOf(M), chosen = [], cands = [], pool = conv;
  for(var i=0;i<sels.length;i++){
    var seen = {}, vals = [], order = (sels[i].options||[]).map(optV);
    pool.forEach(function(c){ var v = c.parts[i]; if(!seen['v'+v]){ seen['v'+v] = 1; vals.push(v); } });
    vals.sort(function(a, b){ var ia = order.indexOf(a), ib = order.indexOf(b); return (ia<0?999:ia) - (ib<0?999:ib); });
    var v = null;
    if(want && want[i]!=null && seen['v'+String(want[i])]) v = String(want[i]);
    else if(prefer){ var pt = prefer[sels[i].label]; if(pt!=null) vals.forEach(function(x){ if(v===null && x!=='' && optText(sels[i], x)===pt) v = x; }); }
    if(v===null) v = vals.length ? vals[0] : '';
    chosen.push(v); cands.push(vals);
    pool = pool.filter(function(c){ return c.parts[i]===v; });
  }
  return {chosen:chosen, cands:cands, entry:pool[0]||null};

function changeSel(M, id, i, v, key){
  key = key || 'sel';
  var sels = selsOf(M), old = resolveSel(M, A[key][id]), prefer = {}, want = old.chosen.slice();
  sels.forEach(function(s, j){ if(old.chosen[j]!=='') prefer[s.label] = optText(s, old.chosen[j]); });
  want[i] = String(v);
  for(var j=i+1;j<sels.length;j++){ if(old.chosen[j]==='') want[j] = null; }   // いままで隠れていたセレクタは、同じ見出しの直前の選択を引き継ぐ
  A[key][id] = resolveSel(M, want, prefer).chosen;
}
function stateById(M, sid){ var ss = statesOf(M); for(var i=0;i<ss.length;i++){ if(ss[i].id===sid) return ss[i]; } return null; }
function currentState(M, id){
  var ss = statesOf(M); if(!ss.length) return null;
  if(convOf(M).length){ var r = resolveSel(M, A.sel[id]); A.sel[id] = r.chosen; return (r.entry && stateById(M, 'c:'+r.entry.key)) || ss[0]; }
  var i = A.st[id]|0; if(i<0 || i>=ss.length) i = 0; return ss[i];
}
function pickStatic(st, rate){
  // 交換率固定の表: 選択中と同じ交換率の表 → 無ければ「貸出=交換」どうしで換算 → 無ければ交換率の違う2つの表から投資枚・獲得枚を逆算 → それも無理なら一番近い表(参考)。
  // 出典の表そのものに誤りがある表(bad)は使わない(逆算の材料にも、3つ目の表としての照合にも使わない)。
  // その交換率の表が求められたときは、ほかの交換率の表から逆算して「参考」にする(badUsed)
  var all = st.list.map(function(s){ return {s:s, pr:parseRate(s.rate)}; }).filter(function(x){ return !!x.pr; });
  var list = all.filter(function(x){ return !x.s.bad; }), bads = all.filter(function(x){ return !!x.s.bad; });
  var fin = function(pk){ pk.bads = bads; pk.badUsed = bads.some(function(x){ return x.pr.kashi===rate.kashi && x.pr.kokan===rate.kokan; }); return pk; };
  if(!list.length) return fin({mode:'near', st:st.list[0], rate:null, exact:false, scaled:false, scale:1});
  for(var i=0;i<list.length;i++){ if(list[i].pr.kashi===rate.kashi && list[i].pr.kokan===rate.kokan) return fin({mode:'exact', st:list[i].s, rate:list[i].pr, exact:true, scaled:false, scale:1}); }
  var eq = null; list.forEach(function(x){ if(!eq && x.pr.kashi===x.pr.kokan) eq = x; });
  if(rate.kashi===rate.kokan && eq) return fin({mode:'scale', st:eq.s, rate:eq.pr, exact:false, scaled:true, scale:eq.pr.kokan/rate.kokan});   // 期待値=(獲得−投資)×1000/交換枚数
  // 逆算: 比率(交換÷貸出)が違う2つの表があれば、行ごとに 獲得枚・投資枚 が一意に決まる
  var byRatio = list.slice().sort(function(x, y){ return rateDist(x.pr, rate)-rateDist(y.pr, rate); });
  var A = eq || byRatio[0], B = null;
  byRatio.forEach(function(x){ if(!B && x!==A && Math.abs(Math.log((x.pr.kokan/x.pr.kashi)/(A.pr.kokan/A.pr.kashi)))>1e-6) B = x; });
  if(B){ var C = null; list.forEach(function(x){ if(!C && x!==A && x!==B) C = x; }); return fin({mode:'derive', st:A.s, rate:A.pr, A:A, B:B, C:C, exact:false, scaled:false, scale:1}); }
  return fin({mode:'near', st:byRatio[0].s, rate:byRatio[0].pr, exact:false, scaled:false, scale:1});
}
function rateWord(pr){ return (pr.kashi===50 && pr.kokan===50) ? '等価' : pr.kashi+'枚貸し'+pr.kokan+'枚交換'; }
function staticBadOf(pk, rate){ var hit = null; (pk.bads||[]).forEach(function(x){ if(!hit && x.pr.kashi===rate.kashi && x.pr.kokan===rate.kokan) hit = x; }); return hit || (pk.bads||[])[0] || null; }
function staticBadText(pk, rate){
  // 求められた交換率の表が出典の誤りで使えないとき(badUsed)の注記。例「出典の 46枚貸し52枚交換 の表に誤りがあるため、等価と 50枚貸し56枚交換 の表から逆算」
  var b = staticBadOf(pk, rate);
  return '出典の '+(b ? rateWord(b.pr) : '選択中の交換率')+' の表に誤りがあるため、'+rateWord(pk.A.pr)+'と '+rateWord(pk.B.pr)+' の表から逆算';
}
function solveGetInv(evA, prA, evB, prB){
  // evA = get×1000/oa − inv×1000/ka, evB = get×1000/ob − inv×1000/kb を get, inv について解く
  var a11 = 1000/prA.kokan, a12 = -1000/prA.kashi, a21 = 1000/prB.kokan, a22 = -1000/prB.kashi, det = a11*a22 - a12*a21;
  if(Math.abs(det)<1e-9) return null;
  return {get:(evA*a22 - a12*evB)/det, inv:(a11*evB - a21*evA)/det};
}
function staticPoints(pk, rate){
  if(pk.mode!=='derive'){
    return srowsOf(pk.st).map(function(r){ return {g:r.g, ev:r.ev*pk.scale, payout:r.payout, min:r.min, hourly:(r.hourly==null ? null : r.hourly*pk.scale), hit:r.hit, n:r.n, raw:null}; });
  }

  srowsOf(pk.B.s).forEach(function(r){ mapB[r.g] = r; }); if(pk.C) srowsOf(pk.C.s).forEach(function(r){ mapC[r.g] = r; });

  rowsA.forEach(function(r){
    var rb = mapB[r.g]; if(!rb) return;
    var gi = solveGetInv(r.ev, pk.A.pr, rb.ev, pk.B.pr); if(!gi) return;
    var ev = gi.get*1000/rate.kokan - gi.inv*1000/rate.kashi, bad = false;
    var rc = mapC[r.g]; if(rc){ var pred = gi.get*1000/pk.C.pr.kokan - gi.inv*1000/pk.C.pr.kashi; if(Math.abs(pred-rc.ev)>Math.max(60, Math.abs(rc.ev)*0.03)) bad = true; }   // 3つ目の表と合わない行は元データの不整合
    out.push({g:r.g, ev:ev, payout:r.payout, min:r.min, hourly:(r.min>0 ? ev/r.min*60 : null), hit:r.hit, n:r.n, raw:null, derived:{get:gi.get, inv:gi.inv}, bad:bad});
  });

}
function point(se, r){
  var f = se.F.f, ev = f.ev(r, se.rate, se.M), min = f.minutes(r, se.M);
  return {g:r.g, ev:ev, payout:f.payout(r, se.M), min:min, hourly:(min>0 ? ev/min*60 : null), hit:f.hit(r, se.M), n:r.n, raw:r};
}
function seriesFor(M, st, rate){
  var se = {kind:st.kind, M:M, rate:rate, state:st, title:st.title, pts:[]};
  if(st.kind==='table'){ se.F = formulaOf(M); se.pts = rowsOf(st.tb).map(function(r){ return point(se, r); }); return se; }

function shortLabels(states){
  var toks = states.map(function(s){ return String(s.label || s.title).split(' / '); });
  if(states.length<2) return toks.map(function(t){ return t.join(' / '); });
  return toks.map(function(t){
    var keep = t.filter(function(x){ return !toks.every(function(u){ return u.indexOf(x)>=0; }); });
    return (keep.length ? keep : t).join(' / ');
  });
}
function keepState(M, id){
  var cur = currentState(M, id); if(cur && !cur.reset) return cur;
  var ss = statesOf(M); for(var i=0;i<ss.length;i++){ if(!ss[i].reset) return ss[i]; }
  return null;
}
var RESET_STRICT = /^(設定変更後|リセット)/, RESET_LOOSE = /or|または|除く|以外/i;
function strictResetText(t){ t = String(t||''); return RESET_STRICT.test(t) && !RESET_LOOSE.test(t); }
function isStrictReset(M, st){
  // どれかのセレクタの選択肢が「設定変更後」「リセット」で始まり、or/または/除く/以外 を含まない
  if(!st || !st.parts) return false; var sels = selsOf(M), ok = false;
  st.parts.forEach(function(v, i){ if(v!=='' && strictResetText(optText(sels[i], v))) ok = true; });
  return ok;
}
function resetCandidate(M){
  // 朝イチのリセット台の表: 設定変更後(リセット)の選択肢を持ち、ほかのセレクタは既定(先頭)、分類も既定のものを優先。無ければ部分一致(「設定変更後」を含む)にフォールバック
  var conv = convOf(M), sels = selsOf(M), best = null;
  conv.forEach(function(c, order){
    var hit = false, off = 0, cat = 0;
    c.parts.forEach(function(v, i){
      if(v==='') return; var t = optText(sels[i], v);
      if(strictResetText(t)){ hit = true; return; }
      var first = optV(((sels[i]||{}).options||[])[0]); if(v!==first){ if(i===0) cat = 1; else off++; }
    });
    if(!hit) return;
    var score = cat*1000 + off*10 + order/100000;
    if(!best || score<best.score) best = {c:c, score:score};
  });
  if(best) return {parts:best.c.parts, key:best.c.key, strict:true};
  var ss = statesOf(M);
  for(var i=0;i<ss.length;i++){ if(ss[i].reset && ss[i].parts) return {parts:ss[i].parts, key:ss[i].id.slice(2), strict:false, title:ss[i].title}; }
  return null;
}
function resetPick(M, id){
  // リセット狙いで使う状態。conv がある機種はセレクタ(保存した選択 A.rsel[id] か自動候補)、無い機種は表の題で選ぶ
  if(convOf(M).length){
    var saved = Array.isArray(A.rsel[id]) ? A.rsel[id] : null, cand = resetCandidate(M);
    if(!saved && !cand) return {state:null};
    var r = resolveSel(M, saved || cand.parts); A.rsel[id] = r.chosen;
    var st = (r.entry && stateById(M, 'c:'+r.entry.key)) || null;
    var note = '';
    if(st && !isStrictReset(M, st)) note = st.reset ? '※設定変更後だけの表が無いため『'+stripName(st.title, M.name)+'』を使用' : '※選んだ状態は設定変更後ではありません';
    return {state:st, r:r, note:note, sel:true};
  }
  var rs = statesOf(M).filter(function(s){ return s.reset; }); if(!rs.length) return {state:null};
  var sid = (typeof A.rsel[id]==='string') ? A.rsel[id] : null, st2 = null; rs.forEach(function(s){ if(s.id===sid) st2 = s; });
  return {state:(st2 || rs[0]), list:rs, note:''};
}

function askRun(q, force){

  var it = {q:q, text:ans.text.slice(0, ASK_TEXT_MAX), t:Date.now(), mid:p.mid||null, ai:false, p:p};
  ASK.thread.push(it); if(ASK.thread.length>ASK_KEEP) ASK.thread = ASK.thread.slice(-ASK_KEEP);

  ASK.draft = ''; store('sn:app', S);

}

/* ---------- 聞く: AI の回答(Artifact 版だけ)。閲覧者の Claude に質問する sample capability を使う ----------

var ASKAI_OK = MODE!=='pwa' && !!(window.claude && typeof window.claude.use==='function');
var ASKAI = {fn:null, tools:0, off:false, busy:null, fail:null};     // busy = {it, ctl, text, stat}(回答中の1件)、fail = {it, msg, part}(直前の失敗)

function askAiInit(){

    var ready = function(lim){ ASKAI.fn = fn; ASKAI.tools = (lim && lim.tools && lim.tools.maxCount>0) ? Math.floor(lim.tools.maxCount) : 0; askAiReveal(); };
    var lp = null; try{ lp = fn.limits(); }catch(e){ lp = null; }

function utf8len(s){ try{ return unescape(encodeURIComponent(s)).length; }catch(e){ return String(s).length*3; } }
function askCap(obj, limit){
  // ツールの戻り値を limit バイト以内に収める: いちばん長い配列の末尾から落とす
  var n = 0, best, walk = function(o){
    if(Array.isArray(o)){ if(o.length>1 && (!best || JSON.stringify(o).length>JSON.stringify(best).length)) best = o; o.forEach(walk); }
    else if(o && typeof o==='object') Object.keys(o).forEach(function(k){ walk(o[k]); });
  };
  while(utf8len(JSON.stringify(obj))>limit && n++<500){ best = null; walk(obj); if(!best) break; best.pop(); if(!Array.isArray(obj)) obj.truncated = true; }
  return obj;
}

function askAiData(it, ans){

function assemble(man){
  // 画像(imgs_1, imgs_2 …)を機種データの it.img / theme.wall に戻し、分割された tenjo_1 … をまとめる
  var SN = window.__SNV || {}, DATA = SN.machines, HIST = SN.history;
  if(!DATA || !DATA.machines || !HIST || !HIST.unit_machine) return null;
  var imgs = {}, stale = [], build = man.build || null;
  Object.keys(SN).forEach(function(k){
    var o = SN[k]; if(!o || typeof o!=='object') return;
    if(build && o._build && o._build!==build) stale.push(k);
    if(/^imgs(_\d+)?$/.test(k)) Object.keys(o).forEach(function(f){ if(f.charAt(0)!=='_') imgs[f] = o[f]; });
  });
  DATA.machines.forEach(function(m){
    (m.hints||[]).forEach(function(g){ (g.items||[]).forEach(function(it){ if(!it.img || /^data:/.test(it.img)) return; if(imgs[it.img]) it.img = imgs[it.img]; else delete it.img; }); });

  });

    if(!tenjo) tenjo = {machines:{}}; if(!tenjo.machines) tenjo.machines = {};
    Object.keys(o.machines).forEach(function(id){ tenjo.machines[id] = o.machines[id]; });
    ['generated','formula','fixture'].forEach(function(f){ if(o[f]!=null && tenjo[f]==null) tenjo[f] = o[f]; });
  });

function bootInline(){
  var man = snvManifest(), need = man.files || ['machines','history'], t0 = Date.now();
  function have(n){ return (window.__SNV||{})[n]!=null; }
  function failed(n){ return (window.__SNV_ERR||[]).indexOf(n)>=0; }
  function settled(){ return need.every(function(n){ return have(n) || failed(n); }); }
  function go(){
    var lost = need.filter(function(n){ return !have(n); }), a = assemble(man);
    if(!a){ bootFatal('機種のデータ'+(lost.length ? '（'+lost.join('、')+'）' : '')+'を読み込めませんでした。通信の状態を確かめて、ページを読み込み直してください。'); return; }
    boot(a.data, a.hist, a.extra); addLog('open');
    var msg = [];
    if(lost.length) msg.push('一部のデータを読み込めませんでした（'+lost.join('、')+'）。画像や期待値の表が出ないことがあります。ページを読み込み直してください。');
    if(a.stale.length) msg.push('古いデータが混ざっています（'+a.stale.join('、')+'）。ページを読み込み直してください。');
    if(msg.length) bootNote(msg.join(' '));
  }
  // data/*.js の読み込み順に頼らない: 全部そろう(か失敗が分かる)まで待ってから起動する
  (function wait(){ var dt = Date.now()-t0; if(settled() || (document.readyState==='complete' && dt>10000) || dt>30000) go(); else setTimeout(wait, 50); })();
}

}

  nameIn.value = userName();
  var bufP = null;
  function getBuf(){ if(!bufP) bufP = fetch('data.enc').then(function(r){ if(!r.ok) throw new Error('data.enc '+r.status); return r.arrayBuffer(); }).catch(function(e){ bufP = null; throw e; }); return bufP; }
  function tryPass(pass, remember, auto){
    msg.textContent = '解錠中…';
    return getBuf().then(function(buf){ return decryptPayload(buf, pass); }).then(function(pl){
      try{ if(remember) localStorage.setItem('snv:pass', pass); else localStorage.removeItem('snv:pass'); }catch(e){}
      LOGCFG = pl.log || null;
      gate.hidden = true; boot(pl.data, pl.history, {tenjo: pl.tenjo||null, aim: pl.aim||null, manual: pl.manual||null});
      addLog(auto ? 'auto' : 'unlock');
    }).catch(function(err){ gate.hidden = false; var wrong = (err && (err.name==='OperationError' || /decrypt/i.test(String(err.message)))); msg.textContent = wrong ? '合言葉が違います' : 'データを読めませんでした: '+(err && err.message ? err.message : err); if(wrong) addLog('fail'); });
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); var nm = nameIn.value.trim(); if(!nm){ msg.textContent = '名前を入れてください'; try{ nameIn.focus(); }catch(e2){} return; } setUserName(nm); tryPass(inp.hidden && savedPass ? savedPass : inp.value.trim(), inp.hidden ? true : save.checked, false); });
  var savedPass = null; try{ savedPass = localStorage.getItem('snv:pass'); }catch(e){}
  if(savedPass && userName()){ tryPass(savedPass, true, true); }
  else if(savedPass){ gate.hidden = false; inp.hidden = true; inp.value = savedPass; msg.textContent = '合言葉は記憶済みです。名前を入れて解錠してください（誰が使ったかの記録用）。'; try{ nameIn.focus(); }catch(e){} }
  else { gate.hidden = false; try{ nameIn.focus(); }catch(e){} }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){ var nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){ if(nw.state==='installed' && navigator.serviceWorker.controller){ var t = document.getElementById('toast'); t.textContent = '新しい版に更新しました。再読み込みします…'; t.classList.add('show'); setTimeout(function(){ location.reload(); }, 1500); } }); });
    }).catch(function(){});
  }
}
if(MODE==='pwa') bootPwa();
else if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bootInline);
else bootInline();
})();
</script>
