<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="設定判別">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="snv-version" content="d1722cdb42">
</head>
<body>
<meta name="snv-mode" content="pwa">
<title>設定判別ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0F14; --panel:#121820; --panel-2:#182029; --panel-3:#1F2933; --ink:#E8EEF4; --ink-2:#A6B2BF; --ink-3:#6F7C8A;
  --line:#26313D; --line-2:#1C2530;
  --accent:#A392F5; --accent-ink:#0B0F14; --accent-soft:#251F45;
  --hot:#D94848; --warm:#C98500; --cool:#3987E5; --none:#3B4652;
  --hot-text:#F09088; --warm-text:#F0B93A; --cool-text:#8BB8F2;
  --hot-soft:#3A1F1E; --warm-soft:#33290F; --cool-soft:#172A44;
  --device:#0A0D11; --device-2:#11161C; --device-line:#232B35; --led:#FFB13B; --led-dim:#6E5225; --led-label:#8E99A6;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  --plus:#D94848; --minus:#3987E5; --good:#3DBE7A;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#E9EDF1; --panel:#FFFFFF; --panel-2:#F3F5F8; --panel-3:#E9EDF2; --ink:#121A24; --ink-2:#4F5C6B; --ink-3:#7C8794;
    --line:#D3DAE2; --line-2:#E5E9EE;
    --accent:#5A3FC0; --accent-ink:#FFFFFF; --accent-soft:#EEEAFB;
    --hot:#D93B2B; --warm:#DFA21B; --cool:#3A7BD5; --none:#B9C2CC;
    --hot-text:#B42A1C; --warm-text:#8A6200; --cool-text:#245FB0;
    --hot-soft:#FBE9E6; --warm-soft:#FCF3DC; --cool-soft:#E6EFFA;
    --shadow:0 1px 2px rgba(18,26,36,.06), 0 6px 18px rgba(18,26,36,.06);
    --plus:#D93B2B; --minus:#3A7BD5; --good:#1E8A4C;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E9EDF1; --panel:#FFFFFF; --panel-2:#F3F5F8; --panel-3:#E9EDF2; --ink:#121A24; --ink-2:#4F5C6B; --ink-3:#7C8794;
  --line:#D3DAE2; --line-2:#E5E9EE;
  --accent:#5A3FC0; --accent-ink:#FFFFFF; --accent-soft:#EEEAFB;
  --hot:#D93B2B; --warm:#DFA21B; --cool:#3A7BD5; --none:#B9C2CC;
  --hot-text:#B42A1C; --warm-text:#8A6200; --cool-text:#245FB0;
  --hot-soft:#FBE9E6; --warm-soft:#FCF3DC; --cool-soft:#E6EFFA;
  --shadow:0 1px 2px rgba(18,26,36,.06), 0 6px 18px rgba(18,26,36,.06);
  --plus:#D93B2B; --minus:#3A7BD5; --good:#1E8A4C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-size:14px;line-height:1.55;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding:0 10px calc(78px + env(safe-area-inset-bottom));min-height:100vh}
.disp{font-family:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:400;letter-spacing:.01em;text-wrap:balance}
.num{font-family:"IBM Plex Mono","BIZ UDPGothic",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.led{font-family:"DotGothic16",ui-monospace,"Courier New",monospace}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* ---- top status strip ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 6px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.top .brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.top .brand .t{font-size:17px;white-space:nowrap}
.top .brand .s{font-size:10px;color:var(--ink-3);letter-spacing:.1em;white-space:nowrap}
.top .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:baseline;gap:4px;font-size:10.5px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;white-space:nowrap}
.stat b{color:var(--ink-2);font-weight:400}
@media (max-width:440px){.top .brand .s{display:none}}

/* ---- panels ---- */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:12px;margin:10px 0}
.card h2{font-size:11px;margin:0 0 10px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::after{content:"";flex:1;height:1px;background:var(--line-2)}
.card h2 .n{color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none}
.sub{font-size:11.5px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap;letter-spacing:.04em}
.badge.hot{background:var(--hot-soft);color:var(--hot-text);border-color:transparent}
.badge.warm{background:var(--warm-soft);color:var(--warm-text);border-color:transparent}
.badge.cool{background:var(--cool-soft);color:var(--cool-text);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:9px 13px;font-weight:700;line-height:1.2;transition:transform .06s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;font-weight:400}
.btn.block{width:100%}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:12.5px;display:flex;gap:10px;align-items:center;margin:10px 0;border-left:3px solid var(--accent)}
.notice .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:12.5px;max-width:92vw;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

/* ---- home ---- */
.unitform{display:flex;gap:8px;align-items:stretch}
.unitform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:24px;letter-spacing:.08em;background:var(--device);color:var(--led)}
.unitform input::placeholder{color:var(--led-dim)}
.unitform input:focus{border-color:var(--accent);outline:none}
.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel-2);font-size:14px;margin-bottom:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;min-height:74px}
.mcard:active{transform:scale(.98)}
.mcard .name{font-weight:700;font-size:13.5px;line-height:1.25}
.mcard .full{font-size:10.5px;color:var(--ink-3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:11px;color:var(--ink-2)}
.mcard .foot .u{color:var(--ink-3);font-size:10px}
.mcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.mcard.on{border-color:var(--accent)}

/* ---- judge header ---- */
.mhead{display:flex;align-items:center;gap:10px;padding:6px 2px 2px}
.mhead .name{font-size:21px;line-height:1.2}
.mhead .full{font-size:10.5px;color:var(--ink-3)}
.unitchip{font-size:11px;padding:4px 9px;border-radius:5px;background:var(--device);border:1px solid var(--device-line);white-space:nowrap;color:var(--led-label)}
.unitchip b{font-size:16px;color:var(--led);font-weight:400;margin-left:4px}

/* ---- result cluster ---- */
.result{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);padding:12px;margin:10px 0;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--none)}
.result.hot::before{background:var(--hot)} .result.warm::before{background:var(--warm)} .result.cool::before{background:var(--cool)}
.verdict{display:flex;align-items:flex-start;gap:12px}
.verdict .word{font-size:28px;line-height:1.15}
.verdict.hot .word{color:var(--hot-text)} .verdict.warm .word{color:var(--warm-text)} .verdict.cool .word{color:var(--cool-text)} .verdict.none .word{color:var(--ink-2)}
.verdict .why{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.gauge{margin:12px 0 4px}
.gauge .lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-bottom:4px}
.gauge .lab b{color:var(--ink);font-size:13px;font-weight:700}
.gauge .track{height:10px;border-radius:2px;background:var(--panel-3);position:relative;overflow:hidden;display:flex;gap:2px}
.gauge .seg{flex:1;background:var(--panel-3)}
.gauge .seg.on{background:var(--hot)} .gauge .seg.on.mid{background:var(--warm)} .gauge .seg.on.low{background:var(--cool)}
.gauge .ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink-3);margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 4px}
.kpi{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px}
.kpi .l{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.kpi .v{font-size:20px;font-weight:600;line-height:1.2;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:400;color:var(--ink-3)}
.bars{margin:10px 0 2px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center}
.bar{display:contents}
.bar .l{font-size:11px;color:var(--ink-2)}
.bar .track{height:12px;background:var(--panel-3);border-radius:0 3px 3px 0;position:relative}
.bar .fill{height:100%;border-radius:0 3px 3px 0;background:var(--none);min-width:2px;transition:width .25s}
.bar.hot .fill{background:var(--hot)} .bar.warm .fill{background:var(--warm)} .bar.cool .fill{background:var(--cool)}
.bar.dead .fill{background:var(--none);opacity:.4}
.bar .v{font-size:11.5px;text-align:right;color:var(--ink-2);min-width:44px}
.bar.best .l,.bar.best .v{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .hot i{background:var(--hot)} .legend .warm i{background:var(--warm)} .legend .cool i{background:var(--cool)}
.evid{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--line-2)}
.evid h3{font-size:10.5px;color:var(--ink-3);margin:0 0 6px;letter-spacing:.12em;text-transform:uppercase}
.evtable{width:100%;border-collapse:collapse;font-size:12px}
.evtable th{font-size:10px;color:var(--ink-3);font-weight:400;text-align:left;padding:2px 4px;border-bottom:1px solid var(--line-2);letter-spacing:.06em}
.evtable td{padding:5px 4px;border-bottom:1px dashed var(--line-2);vertical-align:middle}
.evtable td.r{text-align:right;white-space:nowrap}
.evtable td.lab{max-width:120px}
.evtable .near{font-size:10px;color:var(--ink-3);display:block}
.scale{display:grid;grid-template-columns:auto 1fr auto;gap:5px;align-items:center;font-size:9.5px;color:var(--ink-3);min-width:110px}
.scale .tr{height:5px;background:var(--line);border-radius:3px;position:relative}
.scale .mk{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--panel);transform:translate(-50%,-50%)}
.scale .mk.edge{border-radius:2px;width:7px}
.foot{font-size:10.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}

/* ---- machine theme (壁紙=機種POP / テーマ色) ---- */
body.wall::before{content:"";position:fixed;inset:-24px;background:var(--wall) var(--wall-bgpos,center top)/cover no-repeat;opacity:.16;filter:blur(7px) saturate(1.15);z-index:-1;pointer-events:none}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) body.wall::before{opacity:.12} }
:root[data-theme="light"] body.wall::before{opacity:.12}
.hero{position:relative;margin:4px -10px 0;padding:0;min-height:196px;background:var(--panel-3) var(--hero-pos,center) / var(--hero-size,cover) no-repeat;border-bottom:1px solid var(--line-2);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.25) 45%, rgba(0,0,0,.72) 78%, var(--bg) 100%)}
.hero .hin{position:relative;display:flex;align-items:flex-end;gap:10px;padding:150px 12px 10px;color:#fff}
.hero .hin .name{font-size:24px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.hero .hin .full{font-size:10.5px;color:rgba(255,255,255,.78);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.hero .hin .unitchip{background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.25)}
.hero .hin .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(0,0,0,.35)}
.hero .credit{position:relative;font-size:8.5px;color:rgba(255,255,255,.55);padding:0 12px 6px;text-align:right;letter-spacing:.02em}
.hero .tag{position:absolute;top:10px;left:12px;font-size:9.5px;letter-spacing:.14em;color:#fff;background:var(--accent);padding:2px 7px;border-radius:3px;font-weight:700;text-transform:uppercase}
.app.themed .card h2{color:var(--accent)} .app.themed .card h2::after{background:var(--accent-soft)}
.app.themed .device h2{color:var(--accent)}
.app.themed .segctl button.on,.app.themed .chip.on{border-color:var(--accent)}
.mcard.themed{border-left:3px solid var(--accent);background:linear-gradient(90deg, var(--panel-2) 52%, rgba(0,0,0,0) 100%), var(--wall) var(--card-pos,right center)/cover no-repeat var(--panel-2)}
.mcard.themed .name{color:var(--ink)}

/* ---- precision panel additions ---- */
.status{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}
.stchip{display:inline-flex;align-items:baseline;gap:4px;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;background:var(--panel-2);white-space:nowrap}
.stchip b{color:var(--ink);font-weight:600}
.stchip.hot b{color:var(--hot-text)} .stchip.cool b{color:var(--cool-text)}
.segctl{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.segctl button{border:0;background:transparent;padding:5px 10px;font-size:11.5px;color:var(--ink-2);line-height:1.2}
.segctl button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.prior{margin:12px 0 2px;padding:9px 10px;border:1px dashed var(--line);border-radius:6px;background:var(--panel-2)}
.prior .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prior .ph .t{font-size:11px;color:var(--ink-2)}
.prior .ph .t b{color:var(--ink);font-weight:700}
.prior .strip{display:flex;height:9px;border-radius:2px;overflow:hidden;gap:1px;margin:7px 0 4px;background:var(--panel-3)}
.prior .strip i{display:block;height:100%;background:var(--none)}
.prior .strip i.cool{background:var(--cool)} .prior .strip i.warm{background:var(--warm)} .prior .strip i.hot{background:var(--hot)}
.prior .pv{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3)}
.prior .pv span b{color:var(--ink-2);font-weight:400}
.prior .pm{font-size:10px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.bar .track .pmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55;transform:translateX(-1px)}
.lr{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;white-space:nowrap}
.lr .lb{width:34px;height:6px;background:var(--panel-3);border-radius:2px;position:relative;overflow:hidden;flex:none}
.lr .lb i{position:absolute;top:0;bottom:0;background:var(--none);left:50%;width:0}
.lr.hot .lb i{background:var(--hot);left:50%} .lr.cool .lb i{background:var(--cool);left:auto;right:50%}
.lr.hot{color:var(--hot-text)} .lr.cool{color:var(--cool-text)} .lr.none{color:var(--ink-3)}
.kpis.four{grid-template-columns:1fr 1fr}
.dfield .rate .z{color:var(--led);margin-left:4px}
.gate[hidden],[hidden]{display:none!important}
.gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.gatebox input[type=password]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--device);color:var(--led);font-size:18px;letter-spacing:.08em;margin:10px 0 8px}
.gatebox .row{font-size:12px;color:var(--ink-2);margin-bottom:10px;gap:6px}
.gatebox input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel-2);color:var(--ink);font-size:16px;margin:10px 0 0}
.logtable td,.logtable th{text-align:left;white-space:normal}
.logtable td.num{white-space:nowrap}
.gatebox .msg{font-size:11.5px;color:var(--warm-text);min-height:1.4em;margin-top:8px}

/* ---- counter device ---- */
.device{background:var(--device);border:1px solid var(--device-line);border-radius:8px;padding:11px;color:#E6EAEE}
.device h2{color:var(--led-label);font-size:10.5px;margin:0 0 10px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.device h2::after{content:"";flex:1;height:1px;background:var(--device-line)}
.device h2 .n{color:#5F6975;margin-left:0;font-weight:400;letter-spacing:0;text-transform:none}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dfield{background:var(--device-2);border:1px solid var(--device-line);border-radius:6px;padding:7px 9px 6px;position:relative}
.dfield.wide{grid-column:1 / -1}
.dfield label{display:block;font-size:10.5px;color:var(--led-label);letter-spacing:.06em}
.dfield label .imp{color:var(--led);margin-left:4px}
.dfield input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--device-line);color:var(--led);font-size:28px;line-height:1.1;padding:2px 0;text-align:right;letter-spacing:.04em}
.dfield input::placeholder{color:var(--led-dim)}
.dfield input:focus{outline:none;border-bottom-color:var(--led)}
.dfield .tools{display:grid;grid-template-columns:1fr 2fr auto;gap:5px;align-items:center;margin-top:6px}
.dfield .tools.one{grid-template-columns:1fr auto}
.dfield .plus,.dfield .minus1{background:#161C23;border:1px solid #2A333D;color:var(--led);border-radius:5px;padding:7px 0;font-size:14px;font-weight:700}
.dfield .minus1{color:#8E98A3}
.dfield .plus:active,.dfield .minus1:active{background:#22292F}
.dfield .help{background:none;border:1px solid #2A333D;color:#8E98A3;border-radius:5px;width:30px;height:30px;font-size:12px}
.dfield .helptext{font-size:10.5px;color:#AEB7C0;margin-top:6px;line-height:1.5}
.dfield .helptext.hid{display:none}

  else if(p<=0.2){ w='低設定寄り'; cls='cool'; }

['rate','th','sel','g','prev','rsel','st','memo'].forEach(function(k){ if(!A[k] || typeof A[k]!=='object' || Array.isArray(A[k])) A[k] = {}; });

function stripName(title, name){

function rnum(v, d){ var x = numOr(v, NaN); return (isFinite(x) && x>=10 && x<=1000) ? x : d; }
function rateNow(){
  var r = A.rate, p = r.preset;
  if(p==='50_50') return {id:p, kashi:50, kokan:50, label:'等価（50枚貸し・50枚交換）', short:'等価'};
  if(p==='chodama'){ var k = rnum(r.ck, 51); return {id:p, kashi:k, kokan:k, chodama:true, label:'貯メダル再プレイ（投資も交換も'+k+'枚で計算）', short:'貯メダル'+k+'枚'}; }
  if(p==='custom'){ var a = rnum(r.kashi, 50), b = rnum(r.kokan, 50); return {id:p, kashi:a, kokan:b, label:a+'枚貸し・'+b+'枚交換', short:a+'-'+b}; }
  return {id:'46_51', kashi:46, kokan:51, label:'46枚貸し・51枚交換', short:'46-51'};
}
function parseRate(s){
  // 「等価」「46枚貸し51枚交換」「46-52」「5.6枚交換」「k46_o51」などを {kashi, kokan}(1000円あたりの枚数) に直す。読めなければ null
  s = String(s==null?'':s); var m;
  if((m = /k(\d+(?:\.\d+)?)_o(\d+(?:\.\d+)?)/i.exec(s))) return {kashi:+m[1], kokan:+m[2]};
  if(/貯メダル|貯玉|再プレイ/.test(s)) return {kashi:50, kokan:50, chodama:true};
  var nums = (s.replace(/\d+(?:\.\d+)?\s*円/g, ' ').match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(function(x){ return x>=4 && x<=1000; });
  var up = function(x){ return x<10 ? Math.round(x*100)/10 : x; };     // 5.6枚(100円あたり) → 56枚(1000円あたり)
  var mk = /(\d+(?:\.\d+)?)\s*枚?\s*貸/.exec(s), mo = /(\d+(?:\.\d+)?)\s*枚?\s*(?:交換|換金)/.exec(s);
  if(mk && mo && +mk[1]>=4 && +mo[1]>=4) return {kashi:up(+mk[1]), kokan:up(+mo[1])};   // 「46枚貸し51枚交換」「51枚交換(46枚貸し)」など語で判定
  if(nums.length>=2) return {kashi:up(nums[0]), kokan:up(nums[1])};
  if(/等価/.test(s) && !/非等価/.test(s)) return {kashi:50, kokan:50};
  if(nums.length===1) return {kashi:50, kokan:up(nums[0])};
  return null;
}
function rateDist(a, b){ if(!a || !b) return Infinity; return Math.abs(Math.log(a.kokan/a.kashi) - Math.log(b.kokan/b.kashi)); }
function rateText(pr, raw){ if(!pr) return String(raw||''); if(pr.chodama) return '貯メダル'; if(pr.kashi===50 && pr.kokan===50) return '等価'; return pr.kashi+'枚貸し・'+pr.kokan+'枚交換'; }

/* ---------- 狙い目: 計算式(ここ1か所) ----------
   行 r = {g:打ち始めG, inv:投資枚, get:AT獲得枚, ng:通常時の消化G, tg:総消化G, n:サンプル数}
   tenjo.json の機種に formula_id があり、下の表に無い値なら 基本式(basic) で計算して画面に「参考」と出す */
var FORMULAS = {
  basic: {
    ev: function(r, rate, M){ return r.get*1000/rate.kokan - r.inv*1000/rate.kashi; },
    payout: function(r, M){ var c = +M.coin_g; if(!(c>0) || !(r.tg>0)) return null; return (r.ng*(3-50/c) + (r.tg-r.ng)*3 + r.get)/(r.tg*3)*100; },

function keepState(M, id){

function strictResetText(t){ t = String(t||''); return RESET_STRICT.test(t) && !RESET_LOOSE.test(t); }
function isStrictReset(M, st){
  // どれかのセレクタの選択肢が「設定変更後」「リセット」で始まり、or/または/除く/以外 を含まない
  if(!st || !st.parts) return false; var sels = selsOf(M), ok = false;
  st.parts.forEach(function(v, i){ if(v!=='' && strictResetText(optText(sels[i], v))) ok = true; });

function resetCandidate(M){
  // 朝イチのリセット台の表: 設定変更後(リセット)の選択肢を持ち、ほかのセレクタは既定(先頭)、分類も既定のものを優先。無ければ部分一致(「設定変更後」を含む)にフォールバック

  conv.forEach(function(c, order){
    var hit = false, off = 0, cat = 0;
    c.parts.forEach(function(v, i){
      if(v==='') return; var t = optText(sels[i], v);
      if(strictResetText(t)){ hit = true; return; }
      var first = optV(((sels[i]||{}).options||[])[0]); if(v!==first){ if(i===0) cat = 1; else off++; }
    });

  var pick = t.closest('[data-pick]'); if(pick){ S.machineId = pick.getAttribute('data-pick'); S.unit=''; loadInput(); saveInput(); setView('judge'); return; }
  var cp = t.closest('[data-copy]'); if(cp){ var ta = document.getElementById('memoOut'); var txt = ta ? ta.value : '';
    var done = function(){ toast('コピーしました'); }, fail = function(){ if(ta){ ta.focus(); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('長押しでコピーしてください'); } } };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail); else fail(); return; }
  var sh = t.closest('[data-share]'); if(sh){ var ta2 = document.getElementById('memoOut'); if(navigator.share && ta2) navigator.share({text: ta2.value}).catch(function(){}); return; }
  var sn = t.closest('[data-setname]'); if(sn){ var nmEl = document.getElementById('logname'); setUserName(nmEl ? nmEl.value : ''); toast('名前を保存しました'); return; }
  var lr = t.closest('[data-logrefresh]'); if(lr){ flushLog(); renderCentralLog(); return; }
  var prb = t.closest('[data-prior]'); if(prb){ S.prior = prb.getAttribute('data-prior'); store('sn:app', S); var mm = byId[S.machineId]; if(mm){ renderRates(mm); renderResult(mm); } return; }
  var clr = t.closest('[data-clear]'); if(clr){ IN = blankInput(); saveInput(); renderJudge(); toast('入力を消しました'); return; }
  var m = byId[S.machineId];
  var mn1 = t.closest('[data-minus]'); if(mn1 && m){ var k0 = mn1.getAttribute('data-minus'); IN.counts[k0] = Math.max(0, Math.floor(num(IN.counts[k0]))-1); var inp0 = document.querySelector('[data-count="'+k0+'"]'); if(inp0) inp0.value = IN.counts[k0]; IN.sample=false; saveInput(); renderRates(m); renderResult(m); return; }
  var plus = t.closest('[data-plus]'); if(plus && m){ var k = plus.getAttribute('data-plus'); IN.counts[k] = (Math.floor(num(IN.counts[k]))+1); var inp = document.querySelector('[data-count="'+k+'"]'); if(inp) inp.value = IN.counts[k]; IN.sample=false; saveInput(); renderRates(m); renderResult(m); return; }
  var hlp = t.closest('[data-help]'); if(hlp){ var ht = document.querySelector('[data-helptext="'+hlp.getAttribute('data-help')+'"]'); if(ht) ht.classList.toggle('hid'); return; }
  var mi = t.closest('[data-hintminus]'); if(mi && m){ var key = mi.getAttribute('data-hintminus'); IN.hints[key] = Math.max(0,(IN.hints[key]|0)-1); saveInput(); renderHints(m); renderResult(m); e.stopPropagation(); return; }
  var chip = t.closest('[data-hint]'); if(chip && m){ var key2 = chip.getAttribute('data-hint'); var parts = key2.split('_'); var it = m.hints[+parts[0]].items[+parts[1]];
    if(isLock(it.effect)) IN.hints[key2] = IN.hints[key2] ? 0 : 1; else IN.hints[key2] = (IN.hints[key2]|0)+1;
    IN.sample=false; saveInput(); renderHints(m); renderResult(m); return; }
});
document.getElementById('view').addEventListener('input', function(e){
  var t = e.target; var m = byId[S.machineId];
  if(t.id==='msearch'){ S.q = t.value; var cards = document.querySelectorAll('.mcard'); var q = t.value.trim(); cards.forEach(function(c){ var m2 = byId[c.getAttribute('data-pick')]; c.style.display = (!q || (m2.name+m2.short).indexOf(q)>=0) ? '' : 'none'; }); return; }
  if(t.hasAttribute('data-aim')){
    var ak = t.getAttribute('data-aim');
    if(ak==='q'){ A.q = t.value; var aq = t.value.trim(); document.querySelectorAll('.lrow').forEach(function(c){ var m3 = byId[c.getAttribute('data-aimpick')]; c.style.display = (!aq || (m3 && (m3.name+m3.short).indexOf(aq)>=0)) ? '' : 'none'; }); store('sn:app', S); return; }
    if(!m) return;
    if(ak==='g' || ak==='prev'){ A[ak][m.id] = t.value.replace(/[^0-9]/g, ''); store('sn:app', S); if(ak==='g') updateAimTenjo(); else updateAimReset(); return; }
    if(ak==='memo'){ A.memo[m.id] = t.value; store('sn:app', S); updateAimTenjo(); return; }
    return;
  }
  if(t.hasAttribute('data-aimnum')){ A.rate[t.getAttribute('data-aimnum')] = t.value; store('sn:app', S); aimRefresh(); return; }
  if(t.hasAttribute('data-aimth')){ var tk = t.getAttribute('data-aimth'), tv = numOr(t.value, NaN); if(isFinite(tv)){ A.th[tk] = (tk==='nmin') ? Math.max(0, Math.floor(tv)) : Math.round(tv); store('sn:app', S); aimRefresh(); } return; }
  if(!m) return;
  if(t.hasAttribute('data-in')){ IN[t.getAttribute('data-in')] = t.value; }
  else if(t.hasAttribute('data-count')){ IN.counts[t.getAttribute('data-count')] = t.value; }
  else if(t.hasAttribute('data-denom')){ IN.denoms[t.getAttribute('data-denom')] = t.value; }
  else return;
  if(IN.sample){ IN.sample=false; var nb=document.getElementById('samplenote'); if(nb) nb.remove(); }
  saveInput(); renderRates(m); renderResult(m);
});
document.getElementById('view').addEventListener('change', function(e){
  var t = e.target; var m = byId[S.machineId];
  if(m && (t.hasAttribute('data-aimsel') || t.hasAttribute('data-aimrs') || t.hasAttribute('data-aimstate') || t.hasAttribute('data-aimrsel'))){
    var TM = tenjoOf(m.id); if(!TM) return;
    if(t.hasAttribute('data-aimsel')) changeSel(TM, m.id, +t.getAttribute('data-aimsel'), t.value);
    else if(t.hasAttribute('data-aimrs')) changeSel(TM, m.id, +t.getAttribute('data-aimrs'), t.value, 'rsel');
    else if(t.hasAttribute('data-aimstate')) A.st[m.id] = +t.value;
    else A.rsel[m.id] = t.value;
    store('sn:app', S); renderAim(); return;
  }
  if(!m || !t.hasAttribute('data-hintsel')) return;
  var gi = +t.getAttribute('data-hintsel'); m.hints[gi].items.forEach(function(it, ii){ delete IN.hints[gi+'_'+ii]; });
  if(t.value!=='') IN.hints[gi+'_'+t.value] = 1;
  IN.sample=false; saveInput(); renderResult(m);
});
document.getElementById('view').addEventListener('submit', function(e){
  var f = e.target; if(f.id==='unitform'){ e.preventDefault(); if(pickUnit(document.getElementById('unitin').value)) setView('judge'); }
  else if(f.id==='unitform2'){ e.preventDefault(); if(pickUnit(document.getElementById('unitin2').value)) setView('history'); }
});

/* ---------- boot ---------- */
if(!S.machineId){
  // 初回: サンプル入力で結果の見え方を示す（実データではない）
  S.machineId = 'gogo3'; S.unit = ''; S.view = 'judge'; loadInput();
  IN = {games:'2400', at_games:'', counts:{BB:'9', RB:'11'}, denoms:{}, hints:{}, sample:true}; saveInput();
} else { loadInput(); }
render();
}

/* ---------- 起動: inline(Artifact) は data/*.js などが window.__SNV に置いたデータを読む / pwa は暗号化データを解錠して読む ---------- */
function snvManifest(){ try{ return JSON.parse((document.getElementById('snv-manifest')||{}).textContent || 'null') || {}; }catch(e){ return {}; } }
function bootNote(msg){ var el = document.getElementById('bootnote'); if(!el) return; el.textContent = msg; el.hidden = false; }
function bootFatal(msg){
  var v = document.getElementById('view'); if(!v) return; v.textContent = '';
  var c = document.createElement('div'), h = document.createElement('h2'), p = document.createElement('div');
  c.className = 'card'; h.textContent = '読み込めませんでした'; p.className = 'sub'; p.style.fontSize = '12.5px'; p.textContent = msg;
  c.appendChild(h); c.appendChild(p); v.appendChild(c);
}
function assemble(man){
  // 画像(imgs_1, imgs_2 …)を機種データの it.img / theme.wall に戻し、分割された tenjo_1 … をまとめる
  var SN = window.__SNV || {}, DATA = SN.machines, HIST = SN.history;
  if(!DATA || !DATA.machines || !HIST || !HIST.unit_machine) return null;
  var imgs = {}, stale = [], build = man.build || null;
  Object.keys(SN).forEach(function(k){
    var o = SN[k]; if(!o || typeof o!=='object') return;
    if(build && o._build && o._build!==build) stale.push(k);
    if(/^imgs(_\d+)?$/.test(k)) Object.keys(o).forEach(function(f){ if(f.charAt(0)!=='_') imgs[f] = o[f]; });
  });
  DATA.machines.forEach(function(m){
    (m.hints||[]).forEach(function(g){ (g.items||[]).forEach(function(it){ if(!it.img || /^data:/.test(it.img)) return; if(imgs[it.img]) it.img = imgs[it.img]; else delete it.img; }); });
    var th = m.theme; if(th && th.wall && !/^data:/.test(th.wall)){ if(imgs[th.wall]) th.wall = imgs[th.wall]; else delete th.wall; }
  });
  var tenjo = SN.tenjo || null;
  Object.keys(SN).sort().forEach(function(k){
    if(!/^tenjo_\d+$/.test(k)) return; var o = SN[k]; if(!o || !o.machines) return;
    if(!tenjo) tenjo = {machines:{}}; if(!tenjo.machines) tenjo.machines = {};
    Object.keys(o.machines).forEach(function(id){ tenjo.machines[id] = o.machines[id]; });
    ['generated','formula','fixture'].forEach(function(f){ if(o[f]!=null && tenjo[f]==null) tenjo[f] = o[f]; });
  });
  return {data:DATA, hist:HIST, extra:{tenjo:tenjo, aim:SN.aim||null, manual:SN.manual||null}, stale:stale};
}
function bootInline(){
  var man = snvManifest(), need = man.files || ['machines','history'], t0 = Date.now();
  function have(n){ return (window.__SNV||{})[n]!=null; }
  function failed(n){ return (window.__SNV_ERR||[]).indexOf(n)>=0; }
  function settled(){ return need.every(function(n){ return have(n) || failed(n); }); }
  function go(){
    var lost = need.filter(function(n){ return !have(n); }), a = assemble(man);
    if(!a){ bootFatal('機種のデータ'+(lost.length ? '（'+lost.join('、')+'）' : '')+'を読み込めませんでした。通信の状態を確かめて、ページを読み込み直してください。'); return; }
    boot(a.data, a.hist, a.extra); addLog('open');
    var msg = [];
    if(lost.length) msg.push('一部のデータを読み込めませんでした（'+lost.join('、')+'）。画像や期待値の表が出ないことがあります。ページを読み込み直してください。');
    if(a.stale.length) msg.push('古いデータが混ざっています（'+a.stale.join('、')+'）。ページを読み込み直してください。');
    if(msg.length) bootNote(msg.join(' '));
  }
  // data/*.js の読み込み順に頼らない: 全部そろう(か失敗が分かる)まで待ってから起動する
  (function wait(){ var dt = Date.now()-t0; if(settled() || (document.readyState==='complete' && dt>10000) || dt>30000) go(); else setTimeout(wait, 50); })();
}
function decryptPayload(buf, pass){
  var u8 = new Uint8Array(buf);
  if(String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='SNV1') return Promise.reject(new Error('形式が違います'));
  var salt = u8.slice(4,20), iv = u8.slice(20,32), ct = u8.slice(32);
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:200000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['decrypt']); })
    .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct); })
    .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
}
function bootPwa(){
  var gate = document.getElementById('gate'), msg = document.getElementById('gatemsg'), form = document.getElementById('gateform'), inp = document.getElementById('gatepass'), save = document.getElementById('gatesave'), nameIn = document.getElementById('gatename');
  nameIn.value = userName();
  var bufP = null;
  function getBuf(){ if(!bufP) bufP = fetch('data.enc').then(function(r){ if(!r.ok) throw new Error('data.enc '+r.status); return r.arrayBuffer(); }).catch(function(e){ bufP = null; throw e; }); return bufP; }
  function tryPass(pass, remember, auto){
    msg.textContent = '解錠中…';
    return getBuf().then(function(buf){ return decryptPayload(buf, pass); }).then(function(pl){
      try{ if(remember) localStorage.setItem('snv:pass', pass); else localStorage.removeItem('snv:pass'); }catch(e){}
      LOGCFG = pl.log || null;
      gate.hidden = true; boot(pl.data, pl.history, {tenjo: pl.tenjo||null, aim: pl.aim||null, manual: pl.manual||null});
      addLog(auto ? 'auto' : 'unlock');
    }).catch(function(err){ gate.hidden = false; var wrong = (err && (err.name==='OperationError' || /decrypt/i.test(String(err.message)))); msg.textContent = wrong ? '合言葉が違います' : 'データを読めませんでした: '+(err && err.message ? err.message : err); if(wrong) addLog('fail'); });
  }
  form.addEventListener('submit', function(e){ e.preventDefault(); var nm = nameIn.value.trim(); if(!nm){ msg.textContent = '名前を入れてください'; try{ nameIn.focus(); }catch(e2){} return; } setUserName(nm); tryPass(inp.hidden && savedPass ? savedPass : inp.value.trim(), inp.hidden ? true : save.checked, false); });
  var savedPass = null; try{ savedPass = localStorage.getItem('snv:pass'); }catch(e){}
  if(savedPass && userName()){ tryPass(savedPass, true, true); }
  else if(savedPass){ gate.hidden = false; inp.hidden = true; inp.value = savedPass; msg.textContent = '合言葉は記憶済みです。名前を入れて解錠してください（誰が使ったかの記録用）。'; try{ nameIn.focus(); }catch(e){} }
  else { gate.hidden = false; try{ nameIn.focus(); }catch(e){} }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){ var nw = reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){ if(nw.state==='installed' && navigator.serviceWorker.controller){ var t = document.getElementById('toast'); t.textContent = '新しい版に更新しました。再読み込みします…'; t.classList.add('show'); setTimeout(function(){ location.reload(); }, 1500); } }); });
    }).catch(function(){});
  }
}
if(MODE==='pwa') bootPwa();
else if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bootInline);
else bootInline();
})();
</script>
